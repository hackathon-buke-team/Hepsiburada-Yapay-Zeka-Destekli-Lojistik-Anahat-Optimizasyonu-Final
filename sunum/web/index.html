<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Büke · Anahat Optimizasyonu · Final Sunumu</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#080b11; --panel:#111722; --panel2:#0d1420; --line:#1e2836;
  --ink:#eaf0f8; --muted:#8794a8; --dim:#5b697e;
  --brand:#ff6000; --brand2:#ffa14a; --ok:#3dd68c; --warn:#ffc53d;
  --blue:#57a6ff; --purple:#b18cff; --pink:#ff6b9d;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Segoe UI",Inter,-apple-system,system-ui,Roboto,sans-serif;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center}
.slide{
  position:absolute;width:1280px;height:720px;padding:52px 64px;
  background:
    radial-gradient(1100px 620px at 100% -10%, rgba(255,96,0,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(87,166,255,.08), transparent 60%),
    linear-gradient(160deg,#0c121c 0%,#080b11 100%);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 40px 120px rgba(0,0,0,.65);
  opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .32s ease, transform .32s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
.slide.active{opacity:1;pointer-events:auto;transform:scale(1)}

/* --- typography --- */
.kicker{font:600 12px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--brand);margin:0 0 14px}
h1{font:700 60px/1.03 var(--sans);margin:0 0 14px;letter-spacing:-.025em}
h2{font:700 34px/1.12 var(--sans);margin:0 0 6px;letter-spacing:-.02em}
h3{font:600 17px/1.3 var(--sans);margin:0 0 4px;color:var(--ink)}
.lead{font:400 17px/1.5 var(--sans);color:var(--muted);margin:0 0 8px;max-width:78ch}
.sub{font:400 14px/1.5 var(--sans);color:var(--dim);margin:0}
.mono{font-family:var(--mono)}
.brand{color:var(--brand)} .ok{color:var(--ok)} .blue{color:var(--blue)} .warn{color:var(--warn)}

/* --- layout --- */
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.row{display:flex;gap:16px;min-height:0}
.row.grow{flex:1}
.grow{flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}

.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:0;display:flex;flex-direction:column}
.card.tight{padding:12px 14px}
.card h3{margin:0 0 8px;font:600 13px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* --- KPI --- */
.kpi{text-align:left}
.kpi .v{font:700 40px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .v.sm{font-size:30px}
.kpi .l{font:500 12px/1.3 var(--sans);color:var(--muted);margin-top:6px}
.kpi .d{font:600 12px/1 var(--mono);margin-top:5px}

/* --- chips / list --- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 12px/1 var(--mono);padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted)}
.chip.on{border-color:rgba(255,96,0,.5);background:rgba(255,96,0,.12);color:var(--brand2)}
.chip.ok{border-color:rgba(61,214,140,.45);background:rgba(61,214,140,.1);color:var(--ok)}

ul.tick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ul.tick li{position:relative;padding-left:24px;font:400 15px/1.45 var(--sans);color:var(--muted)}
ul.tick li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:9px;border-radius:3px;
  background:var(--brand);box-shadow:0 0 0 3px rgba(255,96,0,.16)}
ul.tick li b{color:var(--ink);font-weight:600}
ul.tick.ok li::before{background:var(--ok);box-shadow:0 0 0 3px rgba(61,214,140,.14)}

/* --- table --- */
table{width:100%;border-collapse:collapse;font:400 13px/1.35 var(--sans)}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tr.hi td{background:rgba(255,96,0,.07)}
tr.hi td:first-child{font-weight:600}

/* --- chart host --- */
.chart{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.chart svg{flex:1;min-height:0;width:100%;height:100%;display:block;overflow:hidden}
.legend{flex:0 0 auto;display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;row-gap:4px}
.legend span{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--mono);color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* --- code --- */
pre{margin:0;font:400 13px/1.6 var(--mono);color:#c7d3e4;background:rgba(0,0,0,.34);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;white-space:pre;overflow:auto}
pre b{color:var(--brand2);font-weight:600}

/* --- takim --- */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;flex:1;min-height:0}
.mem{align-items:center;text-align:center;justify-content:center;gap:0;padding:22px 14px 20px}
.mem .ph{width:210px;height:210px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:#e9edf3;
  box-shadow:0 18px 40px rgba(0,0,0,.52), 0 0 0 1px rgba(255,255,255,.14), 0 0 0 7px rgba(255,96,0,.07)}
.mem .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mem .nm{font:600 18px/1.25 var(--sans);color:var(--ink);letter-spacing:-.018em;white-space:nowrap;margin-top:22px}
.mem .un{font:400 12.5px/1.35 var(--sans);color:var(--muted);margin-top:9px}
.mem .dp{font:400 12.5px/1.35 var(--sans);color:var(--dim);margin-top:3px}
.mem .deg{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 12px;border-radius:999px;
  font:600 10.5px/1 var(--mono);letter-spacing:.07em;white-space:nowrap;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted)}
.mem .deg i{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.mem .deg.on{border-color:rgba(255,96,0,.42);background:rgba(255,96,0,.11);color:var(--brand2)}
.mem .deg.on i{background:var(--brand);box-shadow:0 0 0 3px rgba(255,96,0,.18)}

/* --- chrome --- */
#bar{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));z-index:40;transition:width .3s ease}
#hud{position:fixed;right:26px;bottom:20px;z-index:40;color:var(--dim);
  font:600 17px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;
  display:flex;gap:7px;align-items:baseline;user-select:none}
#hud b{color:var(--brand);font-size:23px;font-weight:700}

/* --- kenar gezinme okları: yalnız üzerine gelince --- */
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:42;width:52px;height:52px;border-radius:50%;
  border:1px solid var(--line);background:rgba(12,18,28,.82);backdrop-filter:blur(6px);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;
  opacity:0;pointer-events:none;transition:opacity .2s ease,color .16s ease,border-color .16s ease,transform .16s ease}
.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
#navp{left:26px} #navn{right:26px}
body.navon .nav{opacity:1;pointer-events:auto}
body.navon .nav:hover{color:var(--brand);border-color:rgba(255,96,0,.55);background:rgba(20,14,10,.9)}
#navp:hover{transform:translateY(-50%) translateX(-3px)}
#navn:hover{transform:translateY(-50%) translateX(3px)}
.nav[disabled]{opacity:0!important;pointer-events:none}

/* --- kapak logosu --- */
.hblogo{height:34px;width:auto;flex:0 0 auto;align-self:flex-start;display:block;
  margin-bottom:24px;opacity:.95}
/* --- köşe logosu: kapak dışındaki her slaytta --- */
.cnrlogo{position:absolute;top:30px;right:34px;height:19px;width:auto;
  opacity:.5;pointer-events:none;z-index:2}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;z-index:50;
  background:rgba(6,9,14,.97);border-top:2px solid var(--brand);padding:18px 26px 22px;
  transform:translateY(101%);transition:transform .28s ease}
#notes.on{transform:translateY(0)}
#notes h4{margin:0 0 8px;font:600 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--brand)}
#notes .txt{font:400 15px/1.62 var(--sans);color:#d7e0ec;max-width:105ch;white-space:pre-wrap}
#notes .use{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  font:400 13.5px/1.55 var(--sans);color:var(--muted);max-width:105ch}
#notes .use b{color:var(--brand2)}
#toc{position:fixed;inset:0;z-index:60;background:rgba(6,9,14,.985);padding:44px 56px;overflow:auto;display:none}
#toc.on{display:block}
#toc h4{font:600 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--brand);margin:0 0 18px}
#toc ol{columns:3;column-gap:40px;margin:0;padding-left:20px}
#toc li{font:400 14px/2 var(--sans);color:var(--muted);cursor:pointer;break-inside:avoid}
#toc li:hover{color:var(--brand2)}
#toc li b{color:var(--ink);font-weight:600}
/* --- tıklanabilir öğeler --- */
.card[data-pop]{position:relative;cursor:pointer;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.card[data-pop]:hover{border-color:rgba(87,166,255,.55);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.card[data-pop]::after{content:"";position:absolute;right:13px;top:13px;width:7px;height:7px;border-radius:50%;
  background:var(--blue);opacity:.5;transition:opacity .18s ease}
.card[data-pop]:hover::after{opacity:1}
ul.tick li[data-pop]{cursor:pointer;transition:color .16s ease}
ul.tick li[data-pop]:hover{color:#c4d2e6}
ul.tick li[data-pop]::after{content:"";position:absolute;left:-9px;right:-9px;top:-4px;bottom:-4px;border-radius:9px;
  background:transparent;transition:background .16s ease;pointer-events:none}
ul.tick li[data-pop]:hover::after{background:rgba(255,255,255,.055)}

/* --- pop-up --- */
#pop{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:26px;
  visibility:hidden;pointer-events:none}
#pop.on{visibility:visible;pointer-events:auto}
#pop .bd{position:absolute;inset:0;background:rgba(4,7,12,.82);backdrop-filter:blur(7px);
  opacity:0;transition:opacity .22s ease}
#pop.on .bd{opacity:1}
#pop .win{position:relative;width:min(1400px,96vw);max-height:93vh;overflow:auto;
  background:radial-gradient(900px 420px at 92% -25%,rgba(255,96,0,.10),transparent 62%),linear-gradient(165deg,#101825,#0a0f18);
  border:1px solid #243040;border-radius:20px;box-shadow:0 40px 130px rgba(0,0,0,.75);padding:26px 34px 30px;
  opacity:0;transform:scale(.95) translateY(16px);
  transition:opacity .26s ease,transform .3s cubic-bezier(.18,.82,.26,1)}
#pop.on .win{opacity:1;transform:none}
#pop .x{position:absolute;right:16px;top:15px;width:31px;height:31px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--muted);font:400 17px/1 var(--sans);cursor:pointer}
#pop .x:hover{color:var(--ink);border-color:var(--brand)}
#pop .ph{font:700 27px/1.16 var(--sans);letter-spacing:-.022em;color:var(--ink);margin:0 0 18px;
  text-transform:none;padding-right:44px}
.pcols{display:flex;gap:24px;align-items:flex-start}
.pside{flex:0 0 300px;display:flex;flex-direction:column;gap:10px}
.pmain{flex:1;min-width:0}
.pstat{border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:rgba(255,255,255,.028)}
.pstat .v{font:700 21px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pstat .v.sm{font:600 15px/1.35 var(--sans);letter-spacing:0}
.pstat .v .u{font:500 12.5px/1 var(--sans);color:var(--dim);letter-spacing:0}
.pstat .l{font:500 11.5px/1.35 var(--sans);color:var(--muted);margin-top:6px}
.pnote{font:400 14px/1.62 var(--sans);color:var(--muted);margin:15px 0 0}
.pnote+.pnote{margin-top:9px}
.pmain>.pnote:first-child{margin-top:0}
.pstack+.mp-leg,.pbars+.mp-leg{margin-top:13px}
.pnote b{color:var(--ink);font-weight:600}
.pnote.hl{border-left:2px solid var(--brand);padding-left:12px}
.pdef{border:1px solid rgba(87,166,255,.26);background:rgba(87,166,255,.065);border-radius:13px;
  padding:12px 16px;font:400 14px/1.6 var(--sans);color:#b6c6db;margin:0 0 18px}
.pdef b{color:var(--blue);font-weight:600}
.pdef em{font-style:normal;color:var(--ink);font-weight:600}
.pmap{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.015);padding:4px 6px}
.pmap svg{width:100%;height:auto;display:block}
/* dar en-boy oranlı grafikler tam genişlikte aşırı uzuyor: ortala ve sınırla */
.pmap.mid{max-width:660px;margin-left:auto;margin-right:auto}
.pmap.wide{max-width:960px;margin-left:auto;margin-right:auto}

/* --- pop-up bar listesi --- */
.pbars{display:grid;grid-template-columns:repeat(var(--c,2),max-content minmax(90px,1fr) max-content);
  row-gap:11px;column-gap:14px;align-items:center}
.pbars.one{--c:1}
.pbars .r{display:contents}
.pbars:not(.one) .r:nth-child(even) .n{padding-left:16px}
.pbars .n{font:500 13px/1.3 var(--sans);color:var(--muted);white-space:nowrap}
.pbars .t{height:11px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;min-width:90px}
.pbars .t i{display:block;height:100%;border-radius:6px;width:0;
  background:linear-gradient(90deg,var(--blue),#93c6ff);animation:pbgrow .62s cubic-bezier(.2,.85,.3,1) forwards}
@keyframes pbgrow{to{width:var(--w)}}
.pbars .q{font:600 12.5px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap;min-width:58px}
.pbars .hi .n,.pbars .hi .q{color:var(--brand2)}
.pbars .hi .t i{background:linear-gradient(90deg,var(--brand),var(--brand2))}
.pbars .z .n,.pbars .z .q{color:var(--warn)}
.pbars .z .t{background:rgba(255,197,61,.14)}

/* --- pop-up yiginli bar --- */
.pstack{display:grid;grid-template-columns:max-content 1fr max-content;row-gap:13px;column-gap:16px;align-items:center}
.pstack .r{display:contents}
.pstack .n{font:500 13px/1.3 var(--sans);color:var(--muted);white-space:nowrap}
.pstack .t{height:16px;border-radius:8px;overflow:hidden;display:flex;background:rgba(255,255,255,.06)}
.pstack .t i{display:block;height:100%;width:0;flex:0 0 auto;
  animation:pbgrow .7s cubic-bezier(.2,.85,.3,1) forwards}
.pstack .q{font:600 12.5px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}

/* --- pop-up harita --- */
.tr-land{fill:rgba(87,166,255,.05);stroke:rgba(87,166,255,.28);stroke-width:1.2;stroke-linejoin:round}
.mp-dot{opacity:0;transform-box:fill-box;transform-origin:center;animation:mpin .42s cubic-bezier(.2,1.35,.4,1) forwards}
@keyframes mpin{from{opacity:0;transform:scale(.15)}to{opacity:1;transform:scale(1)}}
.mp-lab{font:600 10.5px/1 var(--mono);fill:#9db0c8;opacity:0;animation:mpfade .4s ease forwards;
  paint-order:stroke;stroke:rgba(8,11,17,.88);stroke-width:3px;stroke-linejoin:round}
.ch-num{font:700 9.5px/1 var(--mono);fill:#0a0f18}
.ch-name{font:700 12.5px/1 var(--sans);fill:#f0f5fb;paint-order:stroke;stroke:rgba(8,11,17,.92);
  stroke-width:3.4px;stroke-linejoin:round}
.ch-sub{font:500 10px/1 var(--mono);fill:#ffa14a;paint-order:stroke;stroke:rgba(8,11,17,.92);
  stroke-width:3.4px;stroke-linejoin:round}
.ch-load{font:600 10px/1 var(--mono);fill:#9db0c8;paint-order:stroke;stroke:rgba(8,11,17,.88);
  stroke-width:3.4px;stroke-linejoin:round}
@keyframes mpfade{to{opacity:1}}
.mp-lane{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:mpdraw .6s ease forwards}
@keyframes mpdraw{to{stroke-dashoffset:0}}
.mp-leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;padding-left:4px}
.mp-leg span{display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 var(--mono);color:var(--muted)}
.mp-leg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.mp-leg i.d{width:9px;height:9px;border-radius:50%}
.mp-leg i.sq{width:10px;height:10px;border-radius:3px}

/* ══════════════ slayt içi giriş animasyonu ══════════════
   Slayt aktifleştiğinde kartlar/satırlar sırayla belirir. `.active` sınıfı
   her geçişte kaldırılıp yeniden eklendiği için animasyon her seferinde
   baştan çalışır; grafiklerdeki SVG <animate> de go() içinde yeniden kurulur.
   Böylece 6. slayttan sonrası da canlı gelir. */
@keyframes slidein{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes slidefade{from{opacity:0}to{opacity:1}}
@keyframes slidewipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.slide.active .body > *{animation:slidein .46s cubic-bezier(.18,.82,.26,1) both}
.slide.active .body > *:nth-child(1){animation-delay:.05s}
.slide.active .body > *:nth-child(2){animation-delay:.15s}
.slide.active .body > *:nth-child(3){animation-delay:.25s}
.slide.active .body > *:nth-child(4){animation-delay:.35s}
.slide.active .body .g2>*,.slide.active .body .g3>*,.slide.active .body .g4>*,
.slide.active .body .g5>*,.slide.active .body .row>*{animation:slidein .44s cubic-bezier(.18,.82,.26,1) both}
.slide.active .body .g2>*:nth-child(2),.slide.active .body .g3>*:nth-child(2),
.slide.active .body .g4>*:nth-child(2),.slide.active .body .row>*:nth-child(2){animation-delay:.11s}
.slide.active .body .g3>*:nth-child(3),.slide.active .body .g4>*:nth-child(3){animation-delay:.20s}
.slide.active .body .g4>*:nth-child(4){animation-delay:.29s}
.slide.active .kicker{animation:slidefade .5s ease both}
.slide.active h2{animation:slidein .5s cubic-bezier(.18,.82,.26,1) both}

/* satır satır beliren listeler ve tablolar */
.slide.active ul.tick li{animation:slidein .42s cubic-bezier(.18,.82,.26,1) both}
.slide.active ul.tick li:nth-child(1){animation-delay:.16s}
.slide.active ul.tick li:nth-child(2){animation-delay:.25s}
.slide.active ul.tick li:nth-child(3){animation-delay:.34s}
.slide.active ul.tick li:nth-child(4){animation-delay:.43s}
.slide.active ul.tick li:nth-child(5){animation-delay:.52s}
.slide.active ul.tick li:nth-child(6){animation-delay:.61s}
.slide.active table.anim tbody tr{animation:slidein .4s cubic-bezier(.18,.82,.26,1) both}
.slide.active table.anim tbody tr:nth-child(1){animation-delay:.22s}
.slide.active table.anim tbody tr:nth-child(2){animation-delay:.34s}
.slide.active table.anim tbody tr:nth-child(3){animation-delay:.46s}
.slide.active table.anim tbody tr:nth-child(4){animation-delay:.58s}
.slide.active table.anim tbody tr:nth-child(5){animation-delay:.70s}
.slide.active table.anim tbody tr:nth-child(6){animation-delay:.82s}
.slide.active table.anim tbody tr:nth-child(7){animation-delay:.94s}
.slide.active table.anim tbody tr:nth-child(8){animation-delay:1.06s}
.slide.active table.anim tbody tr:nth-child(9){animation-delay:1.18s}
.slide.active .chips .chip{animation:slidein .4s cubic-bezier(.18,.82,.26,1) both}

/* ══════════════ yardımcılar ══════════════ */
const NF = new Intl.NumberFormat('tr-TR');
const nf = (n,d=0)=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const M  = n => nf(n/1e6,2)+' M';
const esc= s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const C = {brand:'#ff6000',brand2:'#ffa14a',ok:'#3dd68c',blue:'#57a6ff',purple:'#b18cff',
           pink:'#ff6b9d',warn:'#ffc53d',dim:'#5b697e',line:'#1e2836',muted:'#8794a8'};
const STG = ['Stage 0','Stage 1','Stage 2','Stage 3'];
const S = k => D.stages[k];

function svg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`}
function txt(x,y,s,o={}){
  return `<text x="${x}" y="${y}" fill="${o.fill||C.muted}" font-size="${o.size||12}"
   font-family="${o.mono===false?'Segoe UI,sans-serif':'Cascadia Mono,Consolas,monospace'}"
   font-weight="${o.w||500}" text-anchor="${o.anchor||'start'}"
   ${o.rot?`transform="rotate(${o.rot} ${x} ${y})"`:''}>${esc(s)}</text>`}
function grid(x0,y0,w,h,n,fmt){
  let o='';
  for(let i=0;i<=n;i++){
    const y=y0+h-h*i/n;
    o+=`<line x1="${x0}" y1="${y}" x2="${x0+w}" y2="${y}" stroke="${C.line}" stroke-width="1"/>`;
    if(fmt) o+=txt(x0-9,y+4,fmt(i/n),{anchor:'end',size:10.5,fill:C.dim});
  }
  return o}
function bar(x,y,w,h,fill,r=5){
  if(h<=0.5) h=0.5;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(r,w/2,h/2)}" fill="${fill}"/>`}

/* ── animasyonlu çizim yardımcıları ──────────────────────────────────
   Grafikler slayta her girişte yeniden kurulduğu için (bkz. replay())
   bu <animate> öğeleri de her seferinde baştan çalışır. */
const AD=.55;                                   /* varsayılan süre (sn) */
/* tabandan yukarı büyüyen sütun */
function abar(x,y,w,h,fill,r=5,d=0,dur=AD){
  if(h<=0.5) h=0.5;
  const base=y+h, rr=Math.min(r,w/2,h/2);
  return `<rect x="${x}" y="${base}" width="${w}" height="0" rx="${rr}" fill="${fill}">
    <animate attributeName="y" from="${base}" to="${y}" dur="${dur}s" begin="${d}s"
      fill="freeze" calcMode="spline" keySplines=".2 .85 .3 1" keyTimes="0;1"/>
    <animate attributeName="height" from="0" to="${h}" dur="${dur}s" begin="${d}s"
      fill="freeze" calcMode="spline" keySplines=".2 .85 .3 1" keyTimes="0;1"/></rect>`}
/* soldan sağa uzayan yatay bar */
function awide(x,y,w,h,fill,r=5,d=0,dur=AD){
  const rr=Math.min(r,h/2);
  return `<rect x="${x}" y="${y}" width="0" height="${h}" rx="${rr}" fill="${fill}">
    <animate attributeName="width" from="0" to="${Math.max(w,0.6)}" dur="${dur}s" begin="${d}s"
      fill="freeze" calcMode="spline" keySplines=".2 .85 .3 1" keyTimes="0;1"/></rect>`}
/* soldan sağa çizilen çoklu çizgi */
function aline(pts,stroke,sw,d=0,dur=1.1,len=2600){
  return `<polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="${sw}"
    stroke-linejoin="round" pathLength="${len}" stroke-dasharray="${len}" stroke-dashoffset="${len}">
    <animate attributeName="stroke-dashoffset" from="${len}" to="0" dur="${dur}s" begin="${d}s"
      fill="freeze" calcMode="spline" keySplines=".25 .1 .25 1" keyTimes="0;1"/></polyline>`}
/* gecikmeli beliren metin / öğe */
function afade(inner,d=0,dur=.4){
  return `<g opacity="0">${inner}<animate attributeName="opacity" from="0" to="1"
    dur="${dur}s" begin="${d}s" fill="freeze"/></g>`}

/* ── yığılmış sütun: araç maliyeti + SLA ── */
function chartLadder(){
  const W=880,H=380,x0=88,y0=18,w=W-x0-24,h=H-y0-62;

  STG.forEach((k,i)=>{

/* ── arama hunisi ── */
function funnel(rows,W,H,opt){
  opt=opt||{};
  const pctW=opt.pct?54:6, x0=8, gapY=opt.sub?30:13, w=W-16-pctW;
  const bh=Math.min(opt.sub?40:46,(H-8)/rows.length-gapY);
  const max=Math.max(...rows.map(r=>r[1]));      // satırlar azalan sırada olmak zorunda değil
  const LW=12.5*0.62, VW=14*0.62;
  let o='';
  rows.forEach((r,i)=>{
    const y=6+i*(bh+gapY), d=.12+i*.3;
    const label=r[0], val=NF.format(r[1]);
    const lw=label.length*LW, vw=val.length*VW;
    const raw=Math.min(w, w*Math.pow(r[1]/max,.30));
    const inside=raw>=14+lw+18+vw+14;
    const bw=Math.max(24, inside?raw:Math.max(14+lw+14, Math.min(raw, w-vw-22)));
    o+=awide(x0,y,bw,bh,r[2]||C.brand,6,d,.62);
    o+=afade(txt(x0+14,y+bh/2+5,label,{size:12.5,w:600,fill:'#eef3fa'}),d+.2);
    if(inside) o+=afade(txt(x0+bw-14,y+bh/2+5,val,{size:14,w:700,anchor:'end',fill:'#fff'}),d+.5);
    else       o+=afade(txt(x0+bw+11,y+bh/2+5,val,{size:14,w:700,fill:r[2]===C.brand?C.brand2:'#cfd9e6'}),d+.5);
    if(opt.pct&&i>0){
      const pct=100*r[1]/rows[i-1][1];
      o+=afade(txt(W-6,y+bh/2+4,'%'+nf(pct,pct<1?3:1),{size:10.5,anchor:'end',fill:C.dim}),d+.6);
    }
    /* bir üst adımdan bu adıma inen ince bağlantı — "eleme" hissi */
    if(i>0) o+=afade(`<path d="M${x0+18},${y-gapY} L${x0+18},${y}" stroke="${C.line}"
      stroke-width="1.2" fill="none"/>`,d);
    if(r[3]) o+=afade(txt(x0+2,y+bh+15,r[3],{size:9.8,fill:C.dim,mono:false}),d+.3);
  });
  return svg(W,H,o)}

        dur=".42s" begin="${d}s" fill="freeze" calcMode="spline" keySplines=".16 .9 .28 1" keyTimes="0;1"/></g>`;
    o+=afade(txt(x,base+22,l,{anchor:'middle',size:12,w:700,fill:c})+
      txt(x,base+37,cap,{anchor:'middle',size:9.5,fill:C.dim}),+d+.12);
  });
  /* B'den C'ye giden yük alma yayı en son çizilir — anlatının vurgusu burada */
  o+=`<path d="M160,${base-16} C196,${base-58} 262,${base-58} 296,${base-16}" fill="none"
       stroke="${C.brand}" stroke-width="2" marker-end="url(#ar2)"
       pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur=".62s" begin="1.05s" fill="freeze"/></path>`;
  o+=afade(txt(215,H-3,'kapasiteden x+y düşer  ·  TirLedger’da 1 ziyaret, 2 değil',{anchor:'middle',size:10.5,fill:C.ok}),1.6);
  return svg(W,H,o)}

/* ── veri temizleme ── */
function chartClean(){
  const W=430,H=210,x0=8,w=W-16;
  const c=D.cleaning;
  const rows=[['Eğitim grid hücresi',c.history_grid_rows,c.training_grid_rows,C.blue,
               '23 dışlanan tarih: 15 resmî tatil + Ocak–Mayıs son iki günü'],
              ['Tahmin dosyası satırı',D.forecast_vs_dow.rows,D.forecast_vs_dow.rows-D.forecast_vs_dow.zero_rows,C.ok,
               'desi = 0 satırlar Excel’de kalır, optimizasyona girmez']];
  let o='';
  rows.forEach((r,i)=>{
    const y=26+i*100, fw=w*r[2]/r[1], d=.15+i*.35;
    o+=txt(x0,y-9,r[0],{size:11.5,w:700,fill:'#dfe7f2'});
    o+=txt(x0+w,y-9,'toplam '+NF.format(r[1]),{size:10.5,anchor:'end',fill:C.dim});
    o+=bar(x0,y,w,26,'#1b2432',6);
    o+=awide(x0,y,fw,26,r[3],6,d,.7);
    o+=afade(txt(x0+10,y+17.5,NF.format(r[2]),{size:12.5,w:700,fill:'#0a0f16'}),d+.55);
    o+=afade(txt(x0+2,y+42,'kullanılan',{size:10,fill:r[3]})+
      txt(x0+w,y+42,NF.format(r[1]-r[2])+' elendi  (%'+nf(100*(r[1]-r[2])/r[1],1)+')',{size:10,anchor:'end',fill:C.dim})+
      txt(x0,y+60,r[4],{size:10,fill:C.dim,mono:false}),d+.6);
  });
  return svg(W,H,o)}

/* ── maliyet formülü: terimler renk kodlu, altında bu seferin sayıları ──
   Aynı renkler alttaki zaman ekseninde de kullanılır; hangi terimin
   nereden geldiği tek bakışta görünsün. */
function chartFormula(){
  const T=NET.trip, W=880,H=152;
  const hrs=T.use/60, vc=hrs*T.rate_h, kc=T.km*T.rate_km;
  /* [etiket, formül, sayı, renk, genişlik payı] */
  const terms=[
    ['ARAÇ · SÜRE','Saatlik Kira × Kullanım Süresi',
     nf(T.rate_h,2)+' ₺/sa × '+nf(hrs,2)+' sa',nf(vc,2)+' ₺',C.brand,.36],
    ['ARAÇ · MESAFE','Mesafe × Km Başı Maliyet',
     T.km+' km × '+nf(T.rate_km,0)+' ₺',nf(kc,2)+' ₺',C.blue,.30],
    ['SLA CEZASI','Geciken Desi × ceil(Saat) × 0,40 ₺',
     'gecikme yok',nf(0,2)+' ₺',C.warn,.34]];
  const x0=0, w=W-236, gap=11, Y=22, BH=100;
  let o=txt(0,12,'TOPLAM MALİYET  =  ÜÇ TERİMİN TOPLAMI',{size:10,w:700,fill:C.dim});
  let acc=0;
  terms.forEach((t,i)=>{
    const bw=w*t[5]-gap, x=x0+acc; acc+=w*t[5];
    const d=.12+i*.22;
    o+=afade(`<rect x="${x}" y="${Y}" width="${bw.toFixed(1)}" height="${BH}" rx="11"
        fill="${t[4]}14" stroke="${t[4]}55" stroke-width="1.1"/>`+
      txt(x+14,Y+20,t[0],{size:9.5,w:700,fill:t[4]})+
      txt(x+14,Y+43,t[1],{size:12,w:600,fill:'#e3ebf6',mono:false})+
      txt(x+14,Y+66,t[2],{size:10.5,fill:C.muted})+
      txt(x+bw-14,Y+88,t[3],{size:14,w:700,fill:t[4],anchor:'end'}),d);
    if(i<terms.length-1)
      o+=afade(txt(x+bw+gap/2,Y+BH/2+6,'+',{anchor:'middle',size:17,w:700,fill:C.dim}),d+.1);
  });
  o+=afade(txt(w+6,Y+BH/2+7,'=',{size:20,w:700,fill:C.dim,anchor:'middle'})+
    `<rect x="${w+20}" y="${Y}" width="${W-w-20}" height="${BH}" rx="11"
      fill="rgba(255,96,0,.09)" stroke="rgba(255,96,0,.4)" stroke-width="1.2"/>`+
    txt(W-14,Y+20,'TOPLAM',{size:9.5,w:700,fill:C.brand,anchor:'end'})+
    txt(W-14,Y+55,nf(T.cost,2)+' ₺',{anchor:'end',size:24,w:700,fill:C.brand})+
    txt(W-14,Y+76,T.v+' seferinin maliyeti',{anchor:'end',size:9.5,fill:C.dim})+
    txt(W-14,Y+90,'Excel çıktısıyla birebir',{anchor:'end',size:9.5,fill:C.ok}),.85);
  o+=afade(txt(0,H-4,'Bu üç terim dışında hiçbir maliyet kalemi yoktur: sabit ücret, boş dönüş, bekleme ücreti ya da ceza katsayısı yok.',
    {size:10,fill:C.faint,mono:false}),1.1);
  return svg(W,H,o)}

/* ── kullanım süresi: nihai plandan gerçek bir seferin zaman ekseni ────
   Anlatının çekirdeği: kullanım süresi parçalı değil, TEK SÜREKLİ pencere.
   Yükleme başlar başlamaz sayaç işler; son indirme bitene kadar durmaz.
   Yalnız iki katman var: akan şerit ve altındaki saat ekseni. */
function chartFlow(){
  const T=NET.trip, W=880, H=184;
  const segs=[['Çıkış elleçleme',T.hload,C.blue,'ceil('+nf(T.desi)+' × 0,01 dk/desi) = '+T.hload+' dk'],
              ['Yolculuk',T.travel,C.purple,T.km+' km · ceil = '+T.travel+' dk'],
              ['Varış elleçleme',T.hunload,C.blue,'ceil('+nf(T.desi)+' × 0,01 dk/desi) = '+T.hunload+' dk']];
  /* jeton yarıçapı kadar iç boşluk bırak — viewBox kenarında kırpılmasın */
  const tot=T.use, X0=10, X1=W-10, SW=X1-X0, y=20, bh=48;
  const t0=17*60, mm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const px=m=>X0+m/tot*SW;
  /* TEK ortak zaman çizelgesi: her <animate> begin="0s" + aynı dur ile başlar,
     gecikme keyTimes içine gömülür. Aksi hâlde begin ofsetli döngüler ilk
     turdan sonra birbirinden kayar ve dolgular jetonla uyumsuz kalırdı. */
  const DUR=9, hold=1.1, R=(DUR-hold)/DUR;        /* sn — bir tur / yol payı */
  let o='', acc=0;

  /* kullanım süresi kuşağı — tek sürekli pencere */
  o+=afade(`<rect x="${X0}" y="${y-10}" width="${SW}" height="${bh+20}" rx="12"
       fill="rgba(255,96,0,.05)" stroke="rgba(255,96,0,.34)" stroke-width="1.2"/>`,.05);

  segs.forEach((g,i)=>{
    const x=px(acc), w=g[1]/tot*SW, din=.12+i*.14;
    const k0=(acc/tot*R), k1=((acc+g[1])/tot*R);
    const kt =k0>0?`0;${k0.toFixed(4)};${k1.toFixed(4)};1`:`0;${k1.toFixed(4)};1`;
    const vl =(k0>0?'0;':'')+`0;${w.toFixed(1)};${w.toFixed(1)}`;
    o+=afade(`<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="7" fill="rgba(255,255,255,.04)"
         stroke="${C.line}" stroke-width="1"/>`,din);
    /* base width=0: animasyon başlamadan önce dolgu görünmesin */
    o+=`<rect x="${x}" y="${y}" width="0" height="${bh}" rx="7" fill="${g[2]}" opacity=".22">
        <animate attributeName="width" values="${vl}" keyTimes="${kt}"
          dur="${DUR}s" begin="0s" repeatCount="indefinite" calcMode="linear"/></rect>`;
    o+=afade(txt(x+w/2,y+18,g[0],{anchor:'middle',size:12.5,w:700,fill:'#e8eff8'})+
      txt(x+w/2,y+bh+32,g[1]+' dk',{anchor:'middle',size:11.5,w:700,fill:g[2],mono:1})+
      txt(x+w/2,y+bh+47,g[3],{anchor:'middle',size:9.5,fill:C.dim,mono:1}),din+.1);
    acc+=g[1];
    if(i<segs.length-1) o+=afade(`<line x1="${px(acc)}" y1="${y-2}" x2="${px(acc)}" y2="${y+bh+2}"
      stroke="${C.line}" stroke-width="1"/>`,din+.1);
  });

  /* zaman ekseni */
  [[0,'17:00','talep hazır · SLA saati başlar',C.ok],
   [T.hload,mm(t0+T.hload),'araç yola çıkar',C.blue],
   [T.hload+T.travel,mm(t0+T.hload+T.travel),'varış',C.purple],
   [tot,mm(t0+tot),'teslim · SLA saati durur',C.brand]].forEach((k,i,a)=>{
    const x=px(k[0]), an=i===0?'start':(i===a.length-1?'end':'middle');
    o+=afade(`<circle cx="${x}" cy="${y+bh+72}" r="3.6" fill="${k[3]}"/>`+
      txt(x,y+bh+92,k[1],{anchor:an,size:12.5,w:700,fill:'#e8eff8',mono:1})+
      txt(x,y+bh+106,k[2],{anchor:an,size:9.5,fill:C.dim}),.55+i*.12);
  });

  /* akan yük jetonu — dolgularla aynı çizelgede */
  o+=`<g><circle r="8.5" fill="rgba(255,161,74,.28)"/><circle r="4.8" fill="${C.brand2}"/>
      <animateTransform attributeName="transform" type="translate" dur="${DUR}s"
        begin="0s" repeatCount="indefinite" calcMode="linear"
        values="${X0},${y+34}; ${X1},${y+34}; ${X1},${y+34}"
        keyTimes="0;${R.toFixed(4)};1"/></g>`;
  return svg(W,H,o)}

/* o.lanes: [{rows,color,w,op,delay,step}]  ·  o.dot: (merkez,i)->{r,fill,ring}  ·  o.dotDelay */
function mapSVG(o){
  o=o||{};
  let s='<path class="tr-land" d="'+geoPath(TR_A)+'"/><path class="tr-land" d="'+geoPath(TR_T)+'"/>';
  (o.lanes||[]).forEach(set=>{
    s+='<g>'+set.rows.map((l,i)=>{
      const a=XY[l[0]],b=XY[l[1]],dx=b[0]-a[0],dy=b[1]-a[1];
      const cx=(a[0]+b[0])/2-dy*0.11, cy=(a[1]+b[1])/2+dx*0.11;
      const col=typeof set.color==='function'?set.color(l):set.color;
      return '<path class="mp-lane" pathLength="1" d="M'+a[0].toFixed(1)+','+a[1].toFixed(1)+
             'Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+b[0].toFixed(1)+','+b[1].toFixed(1)+
             '" stroke="'+col+'" stroke-width="'+(set.w||1)+'" opacity="'+(set.op||.7)+
             '" style="animation-delay:'+Math.round(set.delay+i*set.step)+'ms"/>';
    }).join('')+'</g>';
  });
  const dot=o.dot||(()=>({r:5,fill:C.blue}));
  const d0=o.dotDelay===undefined?0:o.dotDelay;
  s+=NET.centres.map((c,i)=>{
    const p=XY[i], k=dot(c,i), lb=LAB[c.n]||[11,4,'start'], t=Math.round(d0+i*45);
    return '<g transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')">'+
      (k.ring?'<circle class="mp-dot" r="'+(k.r+4).toFixed(1)+'" fill="none" stroke="'+k.ring+
              '" stroke-width="1.7" style="animation-delay:'+t+'ms"/>':'')+
      '<circle class="mp-dot" r="'+k.r.toFixed(1)+'" fill="'+k.fill+
      '" style="animation-delay:'+t+'ms"/>'+
      '<text class="mp-lab" x="'+lb[0]+'" y="'+lb[1]+'" text-anchor="'+lb[2]+
      '" style="animation-delay:'+(t+130)+'ms">'+c.n+'</text></g>';
  }).join('');
  return '<div class="pmap"><svg viewBox="0 0 '+GB.W+' '+GB.H+'" preserveAspectRatio="xMidYMid meet">'+
         s+'</svg></div>'+(o.legend?leg(o.legend):'');
}

/* nihai plandan gerçek bir uğramalı zincir — harita üzerinde döngüsel animasyon */
const CHLAB={'Mersin':[-15,4,'end'],'Şanlıurfa':[0,34,'middle'],'Mardin':[15,4,'start'],
             'Erzincan':[15,0,'start'],'Sivas':[-15,0,'end']};
function chainSVG(){
  const ch=NET.chain, nm=NET.centres.map(c=>c.n);
  const P=ch.stops.map(st=>XY[nm.indexOf(st.n)]);
  let d='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
  const mid=[], len=[];
  for(let i=1;i<P.length;i++){
    const a=P[i-1],b=P[i],dx=b[0]-a[0],dy=b[1]-a[1];
    const cx=(a[0]+b[0])/2-dy*0.13, cy=(a[1]+b[1])/2+dx*0.13;
    d+='Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+b[0].toFixed(1)+','+b[1].toFixed(1);
    const mx=0.25*a[0]+0.5*cx+0.25*b[0], my=0.25*a[1]+0.5*cy+0.25*b[1];
    const h=Math.hypot(dx,dy)||1;                 /* egrinin ters tarafina 16 birim */
    mid.push([mx+dy/h*21, my-dx/h*21]);
    len.push(Math.hypot(dx,dy));
  }
  const tot=len.reduce((a,b)=>a+b,0), cum=[0];
  len.forEach(l=>cum.push(cum[cum.length-1]+l/tot));
  const n=len.length, T=0.19, W=(1-n*T)/n, kp=['0'], kt=['0'];
  let t=0;
  for(let i=0;i<n;i++){
    t+=T; kp.push(cum[i+1].toFixed(4)); kt.push(t.toFixed(4));
    t+=W; kp.push(cum[i+1].toFixed(4)); kt.push(Math.min(t,1).toFixed(4));
  }
  let s='<path class="tr-land" d="'+geoPath(TR_A)+'"/><path class="tr-land" d="'+geoPath(TR_T)+'"/>';
  s+=NET.centres.map((c,i)=>ch.stops.some(x=>x.n===c.n)?'':
     '<circle cx="'+XY[i][0].toFixed(1)+'" cy="'+XY[i][1].toFixed(1)+
     '" r="2.6" fill="rgba(87,166,255,.3)"/>').join('');
  s+='<path id="chp" d="'+d+'" fill="none" stroke="#ff6000" stroke-width="2.6" '+
     'stroke-linecap="round" opacity=".82"/>';
  s+=mid.map((m,i)=>'<text class="ch-load" x="'+m[0].toFixed(1)+'" y="'+m[1].toFixed(1)+
     '" text-anchor="middle">'+nf(ch.stops[i].load)+' desi yolda</text>').join('');
  s+=ch.stops.map((st,i)=>{
    const p=P[i], lb=CHLAB[st.n]||[15,0,'start'];
    const sub=i===0?nf(st.load)+' desi · '+st.parts+' parça yüklendi'
                   :nf(st.drop)+' desi · '+st.parts+' parça bırakıldı';
    return '<g transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')">'+
      '<circle r="11.5" fill="rgba(255,96,0,.16)"/>'+
      '<circle r="7.6" fill="#ff8a3d" stroke="#0a0f18" stroke-width="1.4"/>'+
      '<text class="ch-num" y="3.3" text-anchor="middle">'+(i+1)+'</text>'+
      '<text class="ch-name" x="'+lb[0]+'" y="'+(lb[1]-1)+'" text-anchor="'+lb[2]+'">'+st.n+
      '  <tspan class="ch-load">'+st.t+'</tspan></text>'+
      '<text class="ch-sub" x="'+lb[0]+'" y="'+(lb[1]+12)+'" text-anchor="'+lb[2]+'">'+sub+'</text>'+
      '</g>';
  }).join('');
  s+='<g><circle r="10.5" fill="rgba(255,161,74,.3)"/>'+
     '<circle r="5.6" fill="#ffc53d" stroke="#0a0f18" stroke-width="1.6"/>'+
     '<animateMotion dur="11s" repeatCount="indefinite" calcMode="linear" keyPoints="'+
     kp.join(';')+'" keyTimes="'+kt.join(';')+'">'+
     '<mpath href="#chp" xlink:href="#chp"/></animateMotion></g>';
  return '<div class="pmap"><svg viewBox="0 0 '+GB.W+' '+GB.H+
    '" preserveAspectRatio="xMidYMid meet" xmlns:xlink="http://www.w3.org/1999/xlink">'+s+'</svg></div>';
}
function pbars(rows,cols){
  const mx=Math.max(...rows.map(r=>r.v));
  return '<div class="pbars'+(cols===1?' one':'')+'">'+rows.map((r,i)=>'<div class="r '+(r.c||'')+'">'+
    '<div class="n">'+r.n+'</div><div class="t"><i style="--w:'+
    (mx?Math.max(r.v/mx*100,1.5):0).toFixed(1)+'%;animation-delay:'+(i*28)+'ms"></i></div>'+
    '<div class="q">'+r.q+'</div></div>').join('')+'</div>';
}
/* rows: {n, q, segs:[{v,col}]} — segmentler ortak ölçeğe göre yığılır */
function pstack(rows){
  const mx=Math.max(...rows.map(r=>r.segs.reduce((a,g)=>a+g.v,0)));
  return '<div class="pstack">'+rows.map((r,i)=>'<div class="r">'+
    '<div class="n">'+r.n+'</div><div class="t">'+r.segs.map((g,j)=>g.v?
      '<i style="--w:'+(g.v/mx*100).toFixed(2)+'%;background:'+g.col+
      ';animation-delay:'+(i*90+j*130)+'ms"></i>':'').join('')+'</div>'+
    '<div class="q">'+r.q+'</div></div>').join('')+'</div>';
}

/* ── 24 saatlik çıkış dağılımı: dakika çözünürlüğünün kanıtı ──────────── */
function clockChart(){
  const K=NET.clock, W=860, H=190, mx=Math.max(...K.hours);
  const X0=8, SW=W-16, bw=SW/24-5, base=H-42;
  let o='';
  o+=`<rect x="${X0}" y="16" width="${(SW/24)*6}" height="${base-16}" rx="8"
       fill="rgba(177,140,255,.07)" stroke="rgba(177,140,255,.25)" stroke-width="1"/>`;
  o+=txt(X0+(SW/24)*3,32,'gece 00–06',{anchor:'middle',size:10.5,w:700,fill:C.purple});
  o+=txt(X0+(SW/24)*3,46,nf(K.night)+' sefer',{anchor:'middle',size:10.5,fill:C.dim});
  K.hours.forEach((v,h)=>{
    const x=X0+h*(SW/24)+2.5, hh=v/mx*(base-58);
    const col=h<6?C.purple:(h>=17&&h<21?C.brand:C.blue);
    o+=`<rect x="${x.toFixed(1)}" y="${base}" width="${bw.toFixed(1)}" height="0" rx="3" fill="${col}" opacity=".85">
        <animate attributeName="height" from="0" to="${hh.toFixed(1)}" dur=".5s"
          begin="${(h*0.045).toFixed(2)}s" fill="freeze"/>
        <animate attributeName="y" from="${base}" to="${(base-hh).toFixed(1)}" dur=".5s"
          begin="${(h*0.045).toFixed(2)}s" fill="freeze"/></rect>`;
    if(h%3===0) o+=txt(x+bw/2,base+16,String(h).padStart(2,'0'),{anchor:'middle',size:10,fill:C.dim});
    if(v>=mx*0.4) o+=txt(x+bw/2,base-hh-6,nf(v),{anchor:'middle',size:10,w:700,fill:col});
  });
  o+=`<line x1="${X0}" y1="${base}" x2="${X0+SW}" y2="${base}" stroke="${C.line}" stroke-width="1"/>`;
  o+=txt(X0,H-8,'planımızdaki '+nf(K.legs)+' aracın çıkış saati · saat başına',{size:10.5,fill:C.dim});
  return '<div class="pmap">'+svg(W,H,o)+'</div>';
}
/* dakikaların 60'a yayılımı — :00'da kümelenmiyor */
function minuteChart(){
  const K=NET.clock, W=860, H=104, mx=Math.max(...K.mins);
  const X0=8, SW=W-16, bw=SW/60-2, base=H-30;
  let o='';
  K.mins.forEach((v,m)=>{
    const x=X0+m*(SW/60)+1, hh=Math.max(v/mx*(base-14),1.5);
    o+=`<rect x="${x.toFixed(1)}" y="${base}" width="${bw.toFixed(1)}" height="0" rx="2"
         fill="${m===0?C.brand:C.ok}" opacity="${m===0?'.95':'.72'}">
        <animate attributeName="height" from="0" to="${hh.toFixed(1)}" dur=".45s"
          begin="${(m*0.012).toFixed(3)}s" fill="freeze"/>
        <animate attributeName="y" from="${base}" to="${(base-hh).toFixed(1)}" dur=".45s"
          begin="${(m*0.012).toFixed(3)}s" fill="freeze"/></rect>`;
    if(m%10===0) o+=txt(x+bw/2,base+15,':'+String(m).padStart(2,'0'),{anchor:'middle',size:10,fill:C.dim});
  });
  o+=`<line x1="${X0}" y1="${base}" x2="${X0+SW}" y2="${base}" stroke="${C.line}" stroke-width="1"/>`;
  o+=txt(X0,H-4,'60 dakika değerinin 60’ı da kullanılıyor · yalnız '+nf(K.on_hour)+
         ' sefer (%'+nf(K.on_hour/K.legs*100,1)+') tam saatte',{size:10.5,fill:C.dim});
  return '<div class="pmap" style="margin-top:12px">'+svg(W,H,o)+'</div>';
}

/* ── 179 günlük hacim: büyük çizgi grafiği ────────────────────────────
   Takvim ızgarası "hangi güne denk geldiğini" gösterir ama büyüklükleri
   okumak zordur. Asıl anlatı burada: düz zaman ekseni üzerinde hacim,
   altında hangi günün hangi rejime ait olduğunu gösteren bir şerit. */
const TR_AY6=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function histBig(){
  const A=NET.cal, d=A.days, n=d.length, max=Math.max(...d);
  const W=880,H=330,x0=62,y0=24,w=W-x0-16,h=H-y0-84;
  const px=i=>x0+w*i/(n-1), py=v=>y0+h-h*v/max;
  const base=new Date(A.start+'T00:00:00');
  const dayAt=i=>{const t=new Date(base);t.setDate(t.getDate()+i);return t};

  let o=grid(x0,y0,w,h,4,v=>nf(v*max/1e6,1)+' M');

  /* ay şeritleri — dönümleri görünür kıl */
  let m=-1, mStart=0;
  const months=[];
  for(let i=0;i<n;i++){
    const mm=dayAt(i).getMonth();
    if(mm!==m){ if(m>=0) months.push([mStart,i-1,m]); m=mm; mStart=i; }
  }
  months.push([mStart,n-1,m]);
  months.forEach((mo,k)=>{
    if(k%2===0) o+=`<rect x="${px(mo[0]).toFixed(1)}" y="${y0}"
      width="${(px(mo[1])-px(mo[0])).toFixed(1)}" height="${h}" fill="rgba(255,255,255,.017)"/>`;
    o+=txt((px(mo[0])+px(mo[1]))/2,y0-8,TR_AY6[mo[2]],{anchor:'middle',size:10.5,w:700,fill:C.dim});
  });

  /* medyan çizgisi */
  const my=py(A.median);
  o+=`<line x1="${x0}" y1="${my.toFixed(1)}" x2="${x0+w}" y2="${my.toFixed(1)}"
       stroke="rgba(61,214,140,.5)" stroke-width="1.2" stroke-dasharray="6 5"/>`;
  const mlab='normal gün medyanı '+nf(A.median)+' desi';
  o+=`<rect x="${(x0+5).toFixed(1)}" y="${(my-18).toFixed(1)}" width="${mlab.length*6.2+12}"
       height="15" rx="4" fill="rgba(8,11,17,.9)"/>`;
  o+=txt(x0+11,my-7,mlab,{size:10,fill:C.ok});

  /* alan + çizgi */
  const pts=d.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  o+=`<defs><linearGradient id="ghb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.blue}" stop-opacity=".42"/>
      <stop offset="1" stop-color="${C.blue}" stop-opacity="0"/></linearGradient>
      <clipPath id="ghc"><rect x="${x0}" y="${y0}" width="0" height="${h}">
        <animate attributeName="width" from="0" to="${w}" dur="1.5s" begin=".2s" fill="freeze"/></rect></clipPath></defs>`;
  o+=`<g clip-path="url(#ghc)"><polygon points="${x0},${y0+h} ${pts} ${x0+w},${y0+h}" fill="url(#ghb)"/>
      <polyline points="${pts}" fill="none" stroke="${C.blue}" stroke-width="1.7" stroke-linejoin="round"/></g>`;

  /* ay sonu günleri: çöküşün kendisi */
  A.flag.forEach((f,i)=>{
    if(f!==2) return;
    const t=dayAt(i);
    if(t.getDate()<25) return;                        /* yalnız ayın son günü */
    const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
    if(t.getDate()!==last) return;
    o+=afade(`<line x1="${px(i).toFixed(1)}" y1="${y0}" x2="${px(i).toFixed(1)}" y2="${y0+h}"
        stroke="${C.brand}" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>
      <circle cx="${px(i).toFixed(1)}" cy="${py(d[i]).toFixed(1)}" r="4.6" fill="${C.brand}"
        stroke="#080b11" stroke-width="1.8"/>`,1.4+i/n*.5);
  });

  /* rejim şeridi: her günün hangi rejime ait olduğu */
  const ry=y0+h+16;
  o+=txt(x0-8,ry+9,'rejim',{anchor:'end',size:9,fill:C.faint});
  o+=`<rect x="${x0}" y="${ry}" width="${w}" height="12" rx="3" fill="rgba(87,166,255,.14)"/>`;
  A.flag.forEach((f,i)=>{
    if(!f) return;
    o+=afade(`<rect x="${(px(i)-1.4).toFixed(1)}" y="${ry}" width="${Math.max(2.8,w/n)}"
      height="12" rx="1.6" fill="${f===2?C.brand:C.warn}"/>`,1.7+i/n*.4);
  });

  o+=afade(txt(x0,ry+30,'01 Oca 2026',{size:10,fill:C.faint})+
    txt(x0+w,ry+30,'28 Haz 2026',{size:10,anchor:'end',fill:C.faint})+
    txt(x0+w/2,ry+30,'179 gün · kesintisiz',{anchor:'middle',size:10,fill:C.faint}),1.9);

  return '<div class="pmap">'+svg(W,H,o)+'</div>'+
    leg([['rgba(87,166,255,.75)','günlük toplam desi'],
         ['rgba(61,214,140,.6)','normal gün medyanı'],
         [C.brand,'ayın son iki günü','d'],
         [C.warn,'resmî tatil','d']]);
}

/* ── rejim karşılaştırması: aynı veriye üç ayrı grup olarak bak ─────── */
function regimeChart(){
  const A=NET.cal, d=A.days;
  const base=new Date(A.start+'T00:00:00');
  const dayAt=i=>{const t=new Date(base);t.setDate(t.getDate()+i);return t};
  const med=a=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0};
  const norm=[],hol=[],me1=[],me0=[];
  d.forEach((v,i)=>{
    const t=dayAt(i), last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
    if(A.flag[i]===2) (t.getDate()===last?me0:me1).push(v);
    else if(A.flag[i]===1) hol.push(v);
    else norm.push(v);
  });
  const rows=[['Normal gün',med(norm),norm.length,C.blue],
              ['Resmî tatil',med(hol),hol.length,C.warn],
              ['Ay sonu −1 gün',med(me1),me1.length,'#ff8a3d'],
              ['Ayın son günü',med(me0),me0.length,C.brand]];
  const W=430,H=210,x0=112,y0=20,w=W-x0-72,h=H-y0-26;
  const max=Math.max(...rows.map(r=>r[1]))*1.02, bh=h/rows.length*0.5;
  let o=txt(0,10,'GÜNLÜK TOPLAM DESİ — GRUP MEDYANI',{size:9,w:700,fill:C.faint});
  rows.forEach((r,i)=>{
    const y=y0+h/rows.length*i+h/rows.length/2-bh/2;
    const bw=Math.max(2,w*r[1]/max), d2=.15+i*.18;
    o+=awide(x0,y,bw,bh,r[3],4,d2,.65);
    o+=afade(txt(x0-9,y+bh/2+4,r[0],{anchor:'end',size:11,fill:i===3?C.brand2:C.muted,w:i===3?700:500})+
      txt(x0-9,y+bh/2+16,r[2]+' gün',{anchor:'end',size:8.5,fill:C.faint}),d2);
    const inside=bw>78;
    o+=afade(txt(inside?x0+bw-9:x0+bw+8,y+bh/2+4,nf(r[1]),
        {size:11,w:700,fill:inside?'#0a0f16':r[3],anchor:inside?'end':'start'})+
      txt(W-2,y+bh/2+4,'%'+nf(100*r[1]/rows[0][1],1),{anchor:'end',size:10.5,fill:C.dim}),d2+.55);
  });
  return svg(W,H,o)}

/* ── 179 günlük takvim ısı haritası ───────────────────────────────────── */
function calHeat(){
  const A=NET.cal, W=860, cell=21, gap=3.4, pad=30;
  const weeks=Math.ceil((A.dow0+A.days.length)/7), H=pad+7*(cell+gap)+34;
  const DOW=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  const AY=['Oca','Şub','Mar','Nis','May','Haz'];
  const x0=(W-weeks*(cell+gap))/2+16;
  let o='';
  DOW.forEach((d,i)=>o+=txt(x0-8,pad+i*(cell+gap)+cell*0.72,d,{anchor:'end',size:9.5,fill:C.dim}));
  let month=-1;
  A.days.forEach((v,i)=>{
    const p=A.dow0+i, wk=Math.floor(p/7), dw=p%7;
    const x=x0+wk*(cell+gap), y=pad+dw*(cell+gap);
    const t=Math.min(v/(A.median*1.6),1), f=A.flag[i];
    const fill=f?(f===2?'#ff6000':'#ffc53d'):`rgba(87,166,255,${(0.10+0.85*t).toFixed(3)})`;
    o+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cell}" height="${cell}" rx="4"
         fill="${fill}" opacity="0"><animate attributeName="opacity" from="0"
         to="${f?'.92':'1'}" dur=".4s" begin="${(i*0.009).toFixed(3)}s" fill="freeze"/></rect>`;
    const d=new Date(A.start); d.setDate(d.getDate()+i);
    if(d.getMonth()!==month){ month=d.getMonth();
      o+=txt(x,pad-9,AY[month],{size:10,w:700,fill:C.muted}); }
  });
  const ly=pad+7*(cell+gap)+18;
  o+=txt(x0,ly,'renk koyulaştıkça günlük desi artar  ·  normal gün medyanı '+nf(A.median)+' desi',
         {size:10.5,fill:C.dim});
  [['#ffc53d','resmî tatil'],['#ff6000','ay sonu (son iki gün)']].forEach((k,i)=>{
    const x=x0+430+i*150;
    o+=`<rect x="${x}" y="${ly-9}" width="11" height="11" rx="3" fill="${k[0]}"/>`;
    o+=txt(x+16,ly,k[1],{size:10.5,fill:C.dim});
  });
  return '<div class="pmap">'+svg(W,H,o)+'</div>';
}

/* ── dışlanan 23 tarih: gerekçesi ve normal güne oranıyla ─────────────
   Her satır "neden dışlandı"yı açıkça söyler. Üç kategori var ve
   ikisine birden giren 2 tarih toplamı 25'ten 23'e indirir. */
function exclInfo(){
  /* iso'dan ayın son / sondan bir önceki gün ayrımını çıkar */
  return NET.excluded.map(e=>{
    const d=new Date(e.iso+'T00:00:00');
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    const meKind=!e.me?'':(d.getDate()===last?'ayın son günü':'ayın sondan bir önceki günü');
    const cat=e.me&&e.h?'iki':(e.h?'tatil':'aysonu');
    const why=e.me&&e.h?(e.h+' + '+meKind)
             :(e.h?e.h:meKind);
    return {...e,cat,why,meKind};
  });
}
function exclChart(){
  const E=exclInfo(), W=880, rowH=19, HEAD=54, H=E.length*rowH+HEAD+22;
  const X0=340, SW=W-X0-92;
  const COL={tatil:'#ffc53d',aysonu:'#ff6000',iki:'#b18cff'};
  const nT=E.filter(e=>e.cat==='tatil').length, nA=E.filter(e=>e.cat==='aysonu').length,
        nI=E.filter(e=>e.cat==='iki').length;

  /* başlık: aritmetiğin kendisi */
  let o=txt(0,13,'15 resmî tatil  +  10 ay sonu günü  =  25 kayıt',{size:11,w:700,fill:C.muted});
  o+=txt(0,30,'−2 tarih ikisine birden giriyor (30 ve 31 Mayıs: hem Kurban Bayramı hem ay sonu)',
         {size:10,fill:C.dim});
  o+=txt(0,45,'=  '+E.length+' ayrı takvim tarihi',{size:11,w:700,fill:C.brand2});
  o+=txt(X0,45,'NORMAL GÜNÜN YÜZDESİ  →  %100 = medyan gün ('+nf(NET.cal.median)+' desi)',
         {size:9.5,w:700,fill:C.dim});
  o+=`<line x1="0" y1="${HEAD-2}" x2="${W}" y2="${HEAD-2}" stroke="${C.line}" stroke-width="1"/>`;
  o+=`<line x1="${X0+SW}" y1="${HEAD+2}" x2="${X0+SW}" y2="${H-18}" stroke="rgba(255,255,255,.18)"
       stroke-width="1" stroke-dasharray="3 3"/>`;

  E.forEach((e,i)=>{
    const y=HEAD+6+i*rowH, w=Math.max(e.r*SW,1.6), col=COL[e.cat], d=(.1+i*.042).toFixed(2);
    o+=afade(txt(0,y+9,e.d,{size:10.5,w:700,fill:'#dfe7f2'})+
      `<rect x="42" y="${y+1}" width="7" height="11" rx="2" fill="${col}"/>`+
      txt(56,y+9,e.why,{size:9.5,fill:C.muted,mono:false}),+d);
    o+=`<rect x="${X0}" y="${y}" width="0" height="12" rx="3" fill="${col}" opacity=".82">
        <animate attributeName="width" from="0" to="${Math.min(w,SW).toFixed(1)}" dur=".5s"
         begin="${d}s" fill="freeze" calcMode="spline" keySplines=".2 .85 .3 1" keyTimes="0;1"/></rect>`;
    o+=afade(txt(X0+SW+8,y+10,'%'+nf(e.r*100,1),{size:10.5,w:700,fill:col}),+d+.45);
  });
  return '<div class="pmap">'+svg(W,H,o)+'</div>'+
    leg([[COL.tatil,'yalnız resmî tatil — '+nT+' tarih','sq'],
         [COL.aysonu,'yalnız ay sonu — '+nA+' tarih','sq'],
         [COL.iki,'ikisi birden — '+nI+' tarih','sq']]);
}

't-fc':{k:'Tahmin modeli',t:'Katman nerede devreye giriyor — gün gün',b:()=>{
  const f=D.forecast_vs_dow;
  const TR=l=>l.replace(' Jun',' Haz').replace(' Jul',' Tem');

  const M4=[['Ay sonu −1 gün',D.calendar.day_before_month_end],

  const tot=f.dow_mean.reduce((a,b)=>a+b,0);

  ps(nf(f.rows),'Tahmin dosyası satırı','sm blue')+
  ps(nf(f.zero_rows),'Bunlardan desi = 0 olan','sm')+
  ps(nf(f.forecast[1])+' desi','30 Haziran tahminimiz','sm brand')+
  ps(nf(Math.round(f.dow_mean[1]))+' desi','Aynı gün için haftagünü ortalaması','sm warn'),
  '<div class="pmap mid">'+chartFc()+'</div>'+

      '<td class="n">×'+nf(M4[i][1],4)+'</td><td class="n">'+nf(Math.round(f.dow_mean[i]))+'</td>'+

'k-use':{k:'Kurallar · zaman',t:'Kullanım süresi — tek sürekli pencere',b:()=>{
  const T=NET.trip, t0=17*60;
  const mm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const rows=[
    [mm(t0),'Talep tamamlanır','Yük artık taşınabilir. <b>SLA saati burada başlar.</b>',C.ok],
    [mm(t0),'Çıkış elleçlemesi başlar','<b>Kullanım süresi saati burada başlar</b> — araç henüz hareket etmedi.',C.brand],
    [mm(t0+T.hload),'Araç yola çıkar','ceil('+nf(T.desi)+' × 0,01) = '+T.hload+' dakika elleçleme bitti.',C.blue],
    [mm(t0+T.hload+T.travel),'Varış merkezine ulaşır','Yol '+T.km+' km · '+T.travel+' dakika.',C.purple],
    [mm(t0+T.use),'İndirme biter','<b>Her iki saat de burada durur:</b> teslim gerçekleşti, araç serbest.',C.brand2]];
  return pcols(
  ps(T.use+' dk','Toplam kullanım süresi = '+nf(T.use/60,2)+' saat','sm brand')+
  ps(T.hload+' + '+T.travel+' + '+T.hunload,'Çıkış elleçleme + yolculuk + varış elleçleme','sm')+
  ps(nf(T.rate_h,2)+' ₺/sa','Kamyon spot saatlik kira','sm blue')+
  ps(nf(T.use/60*T.rate_h,2)+' ₺','Yalnız süreden gelen maliyet','sm')+
  ps('%'+nf(100*(T.hload+T.hunload)/T.use,1),'Sürenin elleçlemede geçen payı','sm warn'),
  '<div class="pmap wide">'+chartFlow()+'</div>'+
  '<table class="anim"><thead><tr><th class="n">Saat</th><th>Ne olur</th><th>Sayaçlara etkisi</th></tr></thead><tbody>'+
  rows.map(function(r){return '<tr><td class="n" style="color:'+r[3]+';font-weight:700">'+r[0]+
    '</td><td><b>'+r[1]+'</b></td><td style="color:var(--muted);font-size:12px">'+r[2]+'</td></tr>'}).join('')+
  '</tbody></table>')}},

'k-cost':{k:'Kurallar · maliyet',t:'Maliyet formülü — üç terim, dördüncüsü yok',b:()=>{
  const T=NET.trip, hrs=T.use/60, vc=hrs*T.rate_h, kc=T.km*T.rate_km;
  return pcols(
  ps(nf(T.cost,2)+' ₺','Örnek seferin toplam maliyeti','sm brand')+
  ps(nf(vc,2)+' ₺','Süre terimi · %'+nf(100*vc/T.cost,1),'sm')+
  ps(nf(kc,2)+' ₺','Mesafe terimi · %'+nf(100*kc/T.cost,1),'sm blue')+
  ps('0,40 ₺','Geciken desi × ceil(saat) başına ceza','sm warn')+
  ps('0,0000 ₺','Bizim hesabımız ile hakemin farkı','sm ok'),
  '<div class="pmap wide">'+chartFormula()+'</div>'+
  '<table class="anim"><thead><tr><th>Araç türü</th><th class="n">Kapasite</th><th class="n">Kiralık ₺/sa</th><th class="n">Kiralık ₺/km</th><th class="n">Spot ₺/sa</th><th class="n">Spot ₺/km</th></tr></thead><tbody>'+
  ['Kamyonet','Hafif Kamyon','Kamyon','Tır'].map(function(t){
    const v=NET.vehicles.filter(function(x){return x[0]===t})[0];
    return '<tr'+(t===T.type?' class="hi"':'')+'><td>'+t+'</td><td class="n">'+nf(v[1])+
      '</td><td class="n">'+nf(v[2],2)+'</td><td class="n">'+nf(v[3],0)+
      '</td><td class="n">'+nf(v[4],2)+'</td><td class="n">'+nf(v[5],0)+'</td></tr>'}).join('')+
  '</tbody></table>')}}
};

<div class="body">

`Ağ 18 transfer merkezi ve 306 yönlü hattan oluşuyor. Geçmiş veride bunların 289'unda gerçekten talep görülmüş.
Sol tarafta bizi sıkıştıran kısıtlar var. En sert olanı iki tanesi: elleçleme kapasitesi — her merkezin günlük bir işlem limiti var ve gece yarısını aşan bir elleçleme oransal olarak iki güne bölünüyor. İkincisi tır kapasitesi — yedi merkezde sıfır, yani oralara tır hiç giremiyor, ve zorunlu kiralık tırlar bu kotayı zaten tüketiyor.

        <li><b>Stage 0 · temel plan</b> — zorunlu kiralık filo önce doldurulur, tır ziyaret bütçesi çıkarılır, her hat-gün için araç kombinasyonları tam numaralandırılır. 1.269 araç, <b>16,48 M₺</b>.</li>
        <li><b>Stage 1-2-3 · maliyet merdiveni</b> — aynı-hat onarımı (−1,80 M₺), milk-run zincirleri (−3,37 M₺), rota ortasında yük alma (−0,08 M₺). Her aşama bir öncekini girdi alır.</li>
        <li><b>Bağımsız hakem</b> — 17 kural ve maliyet, ikinci bir uygulamayla sıfırdan yeniden hesaplanır. Bir aşama ancak hem taban hem aday <b>0 ihlalle</b> geçerse kabul edilir.</li>
        <li><b>Final güvenlikleri</b> — kademeli atomik yayın ve sert süre sınırı; süreç yarıda kesilse bile diskte şemaya uyan geçerli bir plan kalır.</li>
      </ul>
    </div>
    <div class="col" style="flex:.82">
      <div class="card"><h3>Ölçülen sonuç</h3><table class="anim">
        <thead><tr><th>Ölçüt</th><th class="n">Stage 0</th><th class="n">Nihai</th></tr></thead><tbody>
        <tr class="hi"><td>Toplam maliyet</td><td class="n">16,48 M₺</td><td class="n">11,23 M₺</td></tr>
        <tr><td>Fiziksel araç</td><td class="n">1.269</td><td class="n">665</td></tr>
        <tr><td>Ortalama spot doluluk</td><td class="n">%48,02</td><td class="n">%79,03</td></tr>
        <tr><td>%30 altı dolu spot araç</td><td class="n">480</td><td class="n">30</td></tr>
        <tr><td>Hakem ihlali</td><td class="n ok">0</td><td class="n ok">0</td></tr>
        </tbody></table></div>
      <div class="card tight"><h3>Doğrulama</h3>
        <div class="chips">
          <span class="chip ok">592 / 592 regresyon testi</span>
          <span class="chip ok">17 hakem kuralı</span>
          <span class="chip ok">beyan/hakem farkı 0,0000 ₺</span>
          <span class="chip">determinizm kontrolü</span>
          <span class="chip">~150 sn uçtan uca</span>
        </div>
        <p class="sub" style="margin-top:9px">Farklı yıl, farklı hafta ve %125 hacimde de çıkış kodu 0, sıfır ihlal.</p>
      </div>
    </div>
  </div>
</div>`,
`Toparlayayım.
Çözüm dört katmandan oluşuyor. Önce talep tahmini: iki katmanlı, kasten sade bir model — haftagünü medyanı çarpı ölçülmüş takvim çarpanı. Sonra dört aşamalı maliyet merdiveni: temel plan, aynı-hat onarımı, milk-run zincirleri ve rota ortasında yük alma. Üçüncüsü bağımsız hakem: hiçbir sayıya güvenmiyoruz, her şey ikinci bir uygulamayla sıfırdan yeniden hesaplanıyor. Dördüncüsü final güvenlikleri: süreç yarıda kesilse bile diskte geçerli bir plan kalıyor.
Ölçülen sonuç: 16 milyon 481 binden 11 milyon 232 bine, yüzde 31,84 düşüş. Araç sayısı 1.269'dan 665'e, ortalama doluluk yüzde 48'den 79'a. Yüzde 30'un altında dolu spot araç sayısı 480'den 30'a indi.
Ve bunların hepsi sıfır kural ihlaliyle: 592 regresyon testi, 17 hakem kuralı, ve beyan ettiğimiz maliyet ile hakemin bağımsız hesabı arasında sıfır virgül sıfır lira fark.`,
`<b>Kullan:</b> Açılıştaki dört sayıyla simetri kurun. Soldaki listeyi tek tek okumayın — beş maddeyi tek cümlede özetleyip sağdaki tabloya geçin. <b>Ezberlenecek:</b> 16,48 → 11,23 M₺ · 1.269 → 665 · %48 → %79 · 0 ihlal.`);

add('Sorular',`
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <p class="kicker" style="margin-bottom:18px">Teşekkürler</p>
  <h1 style="font-size:78px;margin-bottom:20px">Sorularınız</h1>
  <div class="chips" style="justify-content:center;margin-top:34px">
    <span class="chip on">11,23 M₺ · −%31,84</span>
    <span class="chip ok">0 hakem ihlali</span>
    <span class="chip">665 fiziksel araç</span>
    <span class="chip">592 / 592 test</span>
    <span class="chip">~150 sn</span>
  </div>
  <p class="sub" style="margin-top:40px">Takım Büke · No 997307 — Melih Ekizce · Mustafa Eren Işıktaşlı · Serhat Özdemir · Mert Arı</p>
</div>`,
`Teşekkür ederiz. Sorularınızı bekliyoruz.
Sunumda değinmediğimiz ama sorulursa cevaplamaya hazır olduğumuz konular var: arama uzayının nasıl budandığı, kural yorumlarımızın şartnamedeki dayanağı, ölçüp reddettiğimiz altı fikir, ve açık kalemlerimiz — tahmin bias'ı, Tier B yük alma ve beş duraklı zincir.`,
`<b>Kullan:</b> Bu slaytta kalın; soru-cevap boyunca ekranda dursun. Rozetler jürinin akılda tutmasını istediğimiz beş sayı. <b>Not:</b> açık kalemler sorulursa dürüstçe söyleyin — bias +%28,3, Tier B ~66 bin ₺, 5 durak budama gerektiriyor.`);

/* ══════════════ kurulum ══════════════ */
const CH={ladder:chartLadder,history:chartHistory,cal:chartCal,fc:chartFc,
          fleet:chartFleet,chains:()=>chartChains('Stage 2'),fill:chartFill,mix:chartMix,
          milkf:chartMilkFunnel,pickf:chartPickFunnel,clean:chartClean,flow:chartFlow,
          formula:chartFormula,rules:chartRules,pickstop:chartPickStop};

const stage=document.getElementById('stage');
SL.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'; el.dataset.i=i; el.innerHTML=s.html;
  if(s.title!=='Kapak'){                       /* kapakta zaten büyük logo var */
    const lg=document.createElement('img');
    lg.className='cnrlogo'; lg.src=PH.hb; lg.alt='Hepsiburada';
    el.appendChild(lg);
  }
  stage.appendChild(el);
});
document.querySelectorAll('.chart[data-c]').forEach(node=>{
  const fn=CH[node.dataset.c];
  if(fn) node.innerHTML=fn();
});
document.getElementById('tot').textContent=SL.length;
document.getElementById('tocl').innerHTML=SL.map((s,i)=>`<li data-i="${i}"><b>${i+1}.</b> ${esc(s.title)}</li>`).join('');
document.querySelectorAll('#tocl li').forEach(li=>li.onclick=()=>{go(+li.dataset.i);document.getElementById('toc').classList.remove('on')});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];

/* Aktif slaydın grafiklerini yeniden kur: SVG <animate> öğeleri ancak
   yeniden yaratıldıklarında baştan çalışır. Böylece her slayta her
   dönüşte grafikler yeniden canlanır. */
function replay(el){
  el.querySelectorAll('.chart[data-c]').forEach(node=>{
    const fn=CH[node.dataset.c];
    if(fn) node.innerHTML=fn();
  });
}
function go(i){
  cur=Math.max(0,Math.min(SL.length-1,i));
  slides.forEach((el,j)=>el.classList.toggle('active',j===cur));
  replay(slides[cur]);
  document.getElementById('cur').textContent=cur+1;
  document.getElementById('bar').style.width=((cur+1)/SL.length*100)+'%';
  document.getElementById('ntxt').textContent=SL[cur].notes;
  document.getElementById('nuse').innerHTML=SL[cur].use;
  navp.disabled=cur===0; navn.disabled=cur===SL.length-1;
  location.hash=String(cur+1);
}
function fit(){
  const s=Math.min(window.innerWidth/1320,window.innerHeight/760);
  slides.forEach(el=>el.style.transform=`scale(${s})`);
}
addEventListener('resize',fit);

/* --- kenar okları: fare hareket edince belirir, 2 sn sonra kaybolur --- */
const navp=document.getElementById('navp'), navn=document.getElementById('navn');
let navT=0;
function navShow(){
  if(popOpen())return;
  document.body.classList.add('navon');
  clearTimeout(navT); navT=setTimeout(()=>document.body.classList.remove('navon'),2000);
}
addEventListener('mousemove',navShow);
navp.onclick=e=>{e.stopPropagation();go(cur-1);navShow()};
navn.onclick=e=>{e.stopPropagation();go(cur+1);navShow()};

/* --- pop-up aç / kapat --- */
const popEl=document.getElementById('pop');
const popOpen=()=>popEl.classList.contains('on');
function openPop(k){
  const p=POP[k]; if(!p)return false;
  document.getElementById('popk').textContent=p.k;
  document.getElementById('poph').innerHTML=p.t;
  document.getElementById('popb').innerHTML=p.b();
  const w=popEl.querySelector('.win'); w.scrollTop=0;
  popEl.classList.add('on');
  document.body.classList.remove('navon'); clearTimeout(navT);
  return true;
}
function closePop(){popEl.classList.remove('on')}

addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(popOpen()){closePop();return}
    document.getElementById('toc').classList.remove('on');
    document.getElementById('notes').classList.remove('on');return;
  }
  if(popOpen())return;                       /* pop-up açıkken slayt gezinmesi durur */
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SL.length-1);
  else if(e.key==='n'||e.key==='N')document.getElementById('notes').classList.toggle('on');
  else if(e.key==='o'||e.key==='O')document.getElementById('toc').classList.toggle('on');
});
addEventListener('click',e=>{
  if(popOpen()){                             /* dışarı tıklama yalnız kapatır, slaytı ilerletmez */
    if(!e.target.closest('#pop .win')||e.target.closest('#pop .x'))closePop();
    return;
  }
  if(e.target.closest('#toc')||e.target.closest('#notes')||e.target.closest('.nav'))return;
  const t=e.target.closest('[data-pop]');
  if(t&&openPop(t.dataset.pop))return;
  if(e.target.closest('.slide'))return;        /* slayt içi tıklama sayfayı değiştirmez */
  go(cur + (e.clientX < innerWidth*0.5 ? -1 : 1));
});
fit();
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
</body>
</html>
