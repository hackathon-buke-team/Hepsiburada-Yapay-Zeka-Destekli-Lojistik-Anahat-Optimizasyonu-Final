<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Büke · Anahat Optimizasyonu · Final Sunumu</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#080b11; --panel:#111722; --panel2:#0d1420; --line:#1e2836;
  --ink:#eaf0f8; --muted:#8794a8; --dim:#5b697e;
  --brand:#ff6000; --brand2:#ffa14a; --ok:#3dd68c; --warn:#ffc53d;
  --blue:#57a6ff; --purple:#b18cff; --pink:#ff6b9d;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Segoe UI",Inter,-apple-system,system-ui,Roboto,sans-serif;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center}
.slide{
  position:absolute;width:1280px;height:720px;padding:52px 64px;
  background:
    radial-gradient(1100px 620px at 100% -10%, rgba(255,96,0,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(87,166,255,.08), transparent 60%),
    linear-gradient(160deg,#0c121c 0%,#080b11 100%);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 40px 120px rgba(0,0,0,.65);
  opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .32s ease, transform .32s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
.slide.active{opacity:1;pointer-events:auto;transform:scale(1)}

/* --- typography --- */
.kicker{font:600 12px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--brand);margin:0 0 14px}
h1{font:700 60px/1.03 var(--sans);margin:0 0 14px;letter-spacing:-.025em}
h2{font:700 34px/1.12 var(--sans);margin:0 0 6px;letter-spacing:-.02em}
h3{font:600 17px/1.3 var(--sans);margin:0 0 4px;color:var(--ink)}
.lead{font:400 17px/1.5 var(--sans);color:var(--muted);margin:0 0 8px;max-width:78ch}
.sub{font:400 14px/1.5 var(--sans);color:var(--dim);margin:0}
.mono{font-family:var(--mono)}
.brand{color:var(--brand)} .ok{color:var(--ok)} .blue{color:var(--blue)} .warn{color:var(--warn)}

/* --- layout --- */
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.row{display:flex;gap:16px;min-height:0}
.row.grow{flex:1}
.grow{flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}

.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:0;display:flex;flex-direction:column}
.card.tight{padding:12px 14px}
.card h3{margin:0 0 8px;font:600 13px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* --- KPI --- */
.kpi{text-align:left}
.kpi .v{font:700 40px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .v.sm{font-size:30px}
.kpi .l{font:500 12px/1.3 var(--sans);color:var(--muted);margin-top:6px}
.kpi .d{font:600 12px/1 var(--mono);margin-top:5px}

/* --- chips / list --- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 12px/1 var(--mono);padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted)}
.chip.on{border-color:rgba(255,96,0,.5);background:rgba(255,96,0,.12);color:var(--brand2)}
.chip.ok{border-color:rgba(61,214,140,.45);background:rgba(61,214,140,.1);color:var(--ok)}

ul.tick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ul.tick li{position:relative;padding-left:24px;font:400 15px/1.45 var(--sans);color:var(--muted)}
ul.tick li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:9px;border-radius:3px;
  background:var(--brand);box-shadow:0 0 0 3px rgba(255,96,0,.16)}
ul.tick li b{color:var(--ink);font-weight:600}
ul.tick.ok li::before{background:var(--ok);box-shadow:0 0 0 3px rgba(61,214,140,.14)}

/* --- table --- */
table{width:100%;border-collapse:collapse;font:400 13px/1.35 var(--sans)}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tr.hi td{background:rgba(255,96,0,.07)}
tr.hi td:first-child{font-weight:600}

/* --- chart host --- */
.chart{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.chart svg{flex:1;min-height:0;width:100%;height:100%;display:block;overflow:hidden}
.legend{flex:0 0 auto;display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;row-gap:4px}
.legend span{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--mono);color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* --- code --- */
pre{margin:0;font:400 13px/1.6 var(--mono);color:#c7d3e4;background:rgba(0,0,0,.34);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;white-space:pre;overflow:auto}
pre b{color:var(--brand2);font-weight:600}

/* --- chrome --- */
#bar{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));z-index:40;transition:width .3s ease}
#hud{position:fixed;right:18px;bottom:14px;z-index:40;font:600 12px/1 var(--mono);color:var(--dim);
  display:flex;gap:12px;align-items:center}
#hud b{color:var(--brand)}
#hud kbd{border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--dim);background:rgba(255,255,255,.03)}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;z-index:50;
  background:rgba(6,9,14,.97);border-top:2px solid var(--brand);padding:18px 26px 22px;
  transform:translateY(101%);transition:transform .28s ease}
#notes.on{transform:translateY(0)}
#notes h4{margin:0 0 8px;font:600 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--brand)}
#notes .txt{font:400 15px/1.62 var(--sans);color:#d7e0ec;max-width:105ch;white-space:pre-wrap}
#notes .use{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  font:400 13.5px/1.55 var(--sans);color:var(--muted);max-width:105ch}
#notes .use b{color:var(--brand2)}
#toc{position:fixed;inset:0;z-index:60;background:rgba(6,9,14,.985);padding:44px 56px;overflow:auto;display:none}
#toc.on{display:block}
#toc h4{font:600 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--brand);margin:0 0 18px}
#toc ol{columns:3;column-gap:40px;margin:0;padding-left:20px}
#toc li{font:400 14px/2 var(--sans);color:var(--muted);cursor:pointer;break-inside:avoid}
#toc li:hover{color:var(--brand2)}
#toc li b{color:var(--ink);font-weight:600}
@media print{
  html,body{overflow:visible;background:#fff}
  #stage{position:static;display:block}
  .slide{position:relative;opacity:1!important;transform:none!important;page-break-after:always;margin:0 auto 10mm}
  #bar,#hud,#notes,#toc{display:none}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="hud"><span><b id="cur">1</b> / <span id="tot">1</span></span><kbd>←→</kbd><kbd>N notlar</kbd><kbd>O içindekiler</kbd></div>
<div id="notes"><h4>Konuşma metni</h4><div class="txt" id="ntxt"></div><div class="use" id="nuse"></div></div>
<div id="toc" class="off"><h4>Slayt haritası — hangi sayfada ne var</h4><ol id="tocl"></ol></div>

<script>
const D = __DATA__;

/* ══════════════ yardımcılar ══════════════ */
const NF = new Intl.NumberFormat('tr-TR');
const nf = (n,d=0)=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const M  = n => nf(n/1e6,2)+' M';
const esc= s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const C = {brand:'#ff6000',brand2:'#ffa14a',ok:'#3dd68c',blue:'#57a6ff',purple:'#b18cff',
           pink:'#ff6b9d',warn:'#ffc53d',dim:'#5b697e',line:'#1e2836',muted:'#8794a8'};
const STG = ['Stage 0','Stage 1','Stage 2','Stage 3'];
const S = k => D.stages[k];

function svg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`}
function txt(x,y,s,o={}){
  return `<text x="${x}" y="${y}" fill="${o.fill||C.muted}" font-size="${o.size||12}"
   font-family="${o.mono===false?'Segoe UI,sans-serif':'Cascadia Mono,Consolas,monospace'}"
   font-weight="${o.w||500}" text-anchor="${o.anchor||'start'}"
   ${o.rot?`transform="rotate(${o.rot} ${x} ${y})"`:''}>${esc(s)}</text>`}
function grid(x0,y0,w,h,n,fmt){
  let o='';
  for(let i=0;i<=n;i++){
    const y=y0+h-h*i/n;
    o+=`<line x1="${x0}" y1="${y}" x2="${x0+w}" y2="${y}" stroke="${C.line}" stroke-width="1"/>`;
    if(fmt) o+=txt(x0-9,y+4,fmt(i/n),{anchor:'end',size:10.5,fill:C.dim});
  }
  return o}
function bar(x,y,w,h,fill,r=5){
  if(h<=0.5) h=0.5;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(r,w/2,h/2)}" fill="${fill}"/>`}

/* ── yığılmış sütun: araç maliyeti + SLA ── */
function chartLadder(){
  const W=880,H=380,x0=88,y0=18,w=W-x0-24,h=H-y0-62;
  const max=17.2e6, bw=w/4*0.5, gap=w/4;
  let o=grid(x0,y0,w,h,4,v=>nf(v*17.2,1)+' M');
  STG.forEach((k,i)=>{
    const s=S(k), cx=x0+gap*i+gap/2-bw/2;
    const hv=s.vehicle_cost/max*h, hs=s.sla_penalty/max*h;
    o+=bar(cx,y0+h-hv,bw,hv,i===3?C.brand:'#7a4a2e',0);
    o+=bar(cx,y0+h-hv-hs,bw,hs,i===3?C.warn:'#6b5a2a',5);
    o+=txt(cx+bw/2,y0+h-hv-hs-13,nf(s.total_cost/1e6,2)+' M ₺',{anchor:'middle',size:15,w:700,fill:i===3?'#fff':C.muted});
    o+=txt(cx+bw/2,y0+h+22,k,{anchor:'middle',size:12.5,w:600,fill:i===3?C.brand:C.muted});
    o+=txt(cx+bw/2,y0+h+40,['temel plan','aynı-hat onarım','milk-run','yük alma'][i],{anchor:'middle',size:11,fill:C.dim});
    if(i>0){
      const p=S(STG[i-1]).total_cost, d=(s.total_cost-p)/p*100;
      o+=txt(cx+bw/2,y0+h+58,nf(d,1)+'%',{anchor:'middle',size:12,w:700,fill:C.ok});
    }
  });
  return svg(W,H,o)+`<div class="legend"><span><i style="background:${C.brand}"></i>Araç maliyeti</span>
    <span><i style="background:${C.warn}"></i>SLA cezası</span><span><i style="background:${C.ok}"></i>bir önceki aşamaya göre</span></div>`}

/* ── 179 günlük geçmiş hacim ── */
function chartHistory(){
  const W=880,H=250,x0=64,y0=14,w=W-x0-16,h=H-y0-44;
  const d=D.history.desi, n=d.length, max=Math.max(...d);
  let pts=d.map((v,i)=>`${x0+w*i/(n-1)},${y0+h-h*v/max}`).join(' ');
  let o=grid(x0,y0,w,h,4,v=>nf(v*max/1e6,1)+'M');
  o+=`<polygon points="${x0},${y0+h} ${pts} ${x0+w},${y0+h}" fill="url(#gh)" opacity=".5"/>`;
  o+=`<defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.blue}" stop-opacity=".55"/><stop offset="1" stop-color="${C.blue}" stop-opacity="0"/></linearGradient></defs>`;
  o+=`<polyline points="${pts}" fill="none" stroke="${C.blue}" stroke-width="1.6"/>`;
  D.history.month_end.forEach(day=>{
    const i=D.history.days.indexOf(day); if(i<0) return;
    const x=x0+w*i/(n-1), y=y0+h-h*d[i]/max;
    o+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+h}" stroke="${C.brand}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`;
    o+=`<circle cx="${x}" cy="${y}" r="5" fill="${C.brand}" stroke="#080b11" stroke-width="2"/>`;
    o+=txt(x,y0+h+18,day.slice(5).replace('-','.'),{anchor:'middle',size:10,fill:C.brand2});
  });
  const meVals=D.history.month_end.map(day=>d[D.history.days.indexOf(day)]).filter(v=>v!==undefined);
  const mn=Math.min(...meVals), med=[...d].sort((a,b)=>a-b)[Math.floor(d.length/2)];
  o+=txt(x0+4,y0+12,'Ayın son günü — beş ayda istisnasız çöküş',{size:12.5,w:700,fill:C.brand2});
  o+=txt(x0+4,y0+30,'en düşük ay sonu '+NF.format(mn)+' desi   ·   normal gün medyanı '+NF.format(med),{size:11.5,fill:C.dim});
  o+=txt(x0,y0+h+38,'01 Oca 2026',{size:10.5,fill:C.dim});
  o+=txt(x0+w,y0+h+38,'28 Haz 2026',{size:10.5,fill:C.dim,anchor:'end'});
  return svg(W,H,o)}

/* ── takvim çarpanları ── */
function chartCal(){
  const W=430,H=290,x0=112,y0=16,w=W-x0-58,h=H-y0-34;
  const rows=[['Ay sonu −1 gün',D.calendar.day_before_month_end,C.blue],
              ['Ayın son günü',D.calendar.month_end,C.brand],
              ['Ayın ilk günü',D.calendar.first_day_after_month_end,C.ok],
              ['Normal gün',1,C.dim]];
  const max=1.35, bh=h/rows.length*0.52;
  let o='';
  rows.forEach((r,i)=>{
    const y=y0+h/rows.length*i+h/rows.length/2-bh/2, bw=Math.max(2,w*r[1]/max);
    o+=bar(x0,y,bw,bh,r[2],4);
    o+=txt(x0-10,y+bh/2+4,r[0],{anchor:'end',size:11.5,fill:i===1?C.brand2:C.muted,w:i===1?700:500});
    o+=txt(x0+bw+8,y+bh/2+4,'×'+nf(r[1],4),{size:12,w:700,fill:i===1?C.brand:C.muted});
  });
  o+=`<line x1="${x0+w/max}" y1="${y0}" x2="${x0+w/max}" y2="${y0+h}" stroke="${C.line}" stroke-dasharray="4 4"/>`;
  return svg(W,H,o)}

/* ── tahmin vs DOW ortalaması ── */
function chartFc(){
  const W=430,H=300,x0=52,y0=14,w=W-x0-14,h=H-y0-52;
  const f=D.forecast_vs_dow, n=f.labels.length;
  const max=Math.max(...f.dow_mean,...f.forecast)*1.06;
  const g=w/n, bw=g*0.3;
  let o=grid(x0,y0,w,h,3,v=>nf(v*max/1e6,1)+'M');
  f.labels.forEach((l,i)=>{
    const cx=x0+g*i+g/2;
    const h1=h*f.dow_mean[i]/max, h2=h*f.forecast[i]/max;
    o+=bar(cx-bw-2,y0+h-h1,bw,h1,'#33415a',3);
    o+=bar(cx+2,y0+h-h2,bw,h2,i===1?C.brand:C.ok,3);
    o+=txt(cx,y0+h+16,l.replace(' Jun',' Haz').replace(' Jul',' Tem'),{anchor:'middle',size:9.5,fill:i===1?C.brand2:C.dim});
  });
  const cx=x0+g*1+g/2;
  o+=txt(cx,y0+h-18,'×0,02',{anchor:'middle',size:12,w:700,fill:C.brand});
  o+=txt(x0,y0+h+34,'30 Haziran: 24.040 desi tahmin — ortalama 1.110.177',{size:10.5,fill:C.dim});
  return svg(W,H,o)+`<div class="legend"><span><i style="background:#33415a"></i>Aynı haftagünü ortalaması</span>
    <span><i style="background:${C.ok}"></i>Bizim tahminimiz</span></div>`}

/* ── backtest WMAPE ── */
function chartBt(){
  const W=430,H=300,x0=52,y0=14,w=W-x0-14,h=H-y0-58;
  const keys=Object.keys(D.backtest), series=[['naive','Naive',  '#33415a'],['dow_median','DOW medyanı',C.blue],['ours','Bizim model',C.brand]];
  const max=0.75, g=w/keys.length, bw=g*0.2;
  let o=grid(x0,y0,w,h,3,v=>nf(v*max,2));
  keys.forEach((k,i)=>{
    series.forEach((s,j)=>{
      const v=D.backtest[k][s[0]], bh=h*v/max;
      const x=x0+g*i+g/2+(j-1)*(bw+6)-bw/2;
      o+=bar(x,y0+h-bh,bw,bh,s[2],3);
      o+=txt(x+bw/2,y0+h-bh-7,nf(v,4).replace('0,','0,'),{anchor:'middle',size:10,w:700,fill:j===2?C.brand2:C.dim});
    });
    o+=txt(x0+g*i+g/2,y0+h+18,k.split(' ').slice(0,2).join(' '),{anchor:'middle',size:11,w:600,fill:C.muted});
    o+=txt(x0+g*i+g/2,y0+h+34,k.split(' ').slice(2).join(' '),{anchor:'middle',size:10,fill:C.dim});
  });
  return svg(W,H,o)+`<div class="legend"><span><i style="background:#33415a"></i>Naive</span>
    <span><i style="background:${C.blue}"></i>DOW medyanı</span><span><i style="background:${C.brand}"></i>Bizim model</span></div>`}

/* ── araç sayısı ── */
function chartFleet(){
  const W=430,H=330,x0=52,y0=14,w=W-x0-14,h=H-y0-56;
  const max=1400, g=w/4, bw=g*0.44;
  let o=grid(x0,y0,w,h,4,v=>nf(v*max,0));
  STG.forEach((k,i)=>{
    const s=S(k), bh=h*s.routes/max, x=x0+g*i+g/2-bw/2;
    o+=bar(x,y0+h-bh,bw,bh,i===3?C.brand:'#33415a',5);
    o+=txt(x+bw/2,y0+h-bh-8,NF.format(s.routes),{anchor:'middle',size:14,w:700,fill:i===3?C.brand2:C.muted});
    o+=txt(x+bw/2,y0+h+18,'S'+i,{anchor:'middle',size:11.5,w:600,fill:C.dim});
  });
  o+=txt(x0,y0+h+38,'1.269 → 665 fiziksel araç  ·  −%47,6',{size:11.5,w:600,fill:C.ok});
  return svg(W,H,o)}

/* ── zincir dağılımı (donut) ── */
function chartChains(stage){
  const W=430,H=270,cx=142,cy=132,R=94,r=56;
  const c=S(stage||'Stage 3').chain_size_counts;
  const items=[['1 bacak',c['1'],'#33415a'],['2 durak',c['2'],C.blue],['3 durak',c['3'],C.purple],['4 durak',c['4'],C.brand]];
  const tot=items.reduce((a,b)=>a+b[1],0);
  let a0=-Math.PI/2,o='';
  items.forEach(it=>{
    const a1=a0+2*Math.PI*it[1]/tot, big=(a1-a0)>Math.PI?1:0;
    const p=(rr,a)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
    const [x1,y1]=p(R,a0),[x2,y2]=p(R,a1),[x3,y3]=p(r,a1),[x4,y4]=p(r,a0);
    o+=`<path d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${big} 0 ${x4},${y4} Z" fill="${it[2]}" stroke="#080b11" stroke-width="2"/>`;
    a0=a1;
  });
  o+=txt(cx,cy-2,NF.format(tot),{anchor:'middle',size:26,w:700,fill:'#fff'});
  o+=txt(cx,cy+18,'fiziksel araç',{anchor:'middle',size:10.5,fill:C.dim});
  items.forEach((it,i)=>{
    const y=52+i*44;
    o+=`<rect x="262" y="${y-10}" width="11" height="11" rx="3" fill="${it[2]}"/>`;
    o+=txt(282,y,it[0],{size:12,fill:C.muted});
    o+=txt(W-14,y,NF.format(it[1]),{size:13,w:700,anchor:'end',fill:it[2]});
  });
  return svg(W,H,o)}

/* ── doluluk CDF ── */
function chartFill(){
  const W=430,H=330,x0=44,y0=14,w=W-x0-14,h=H-y0-50;
  const cols=['#33415a','#4b6180',C.blue,C.brand];

/* ── arama hunisi ── */
function funnel(rows,W,H,opt){
  opt=opt||{};
  const pctW=opt.pct?54:6, x0=8, gapY=13, w=W-16-pctW;
  const bh=Math.min(46,(H-8)/rows.length-gapY);
  const max=Math.max(...rows.map(r=>r[1]));      // satırlar azalan sırada olmak zorunda değil
  const LW=12.5*0.62, VW=14*0.62;
  let o='';
  rows.forEach((r,i)=>{
    const y=6+i*(bh+gapY);
    const label=r[0], val=NF.format(r[1]);
    const lw=label.length*LW, vw=val.length*VW;
    const raw=Math.min(w, w*Math.pow(r[1]/max,.30));
    const inside=raw>=14+lw+18+vw+14;
    const bw=Math.max(24, inside?raw:Math.max(14+lw+14, Math.min(raw, w-vw-22)));
    o+=bar(x0,y,bw,bh,r[2]||C.brand,6);
    o+=txt(x0+14,y+bh/2+5,label,{size:12.5,w:600,fill:'#eef3fa'});
    if(inside) o+=txt(x0+bw-14,y+bh/2+5,val,{size:14,w:700,anchor:'end',fill:'#fff'});
    else       o+=txt(x0+bw+11,y+bh/2+5,val,{size:14,w:700,fill:r[2]===C.brand?C.brand2:'#cfd9e6'});
    if(opt.pct&&i>0){
      const pct=100*r[1]/rows[i-1][1];
      o+=txt(W-6,y+bh/2+4,'%'+nf(pct,pct<1?3:1),{size:10.5,anchor:'end',fill:C.dim});
    }
  });
  return svg(W,H,o)}

add('Backtest',`
<p class="kicker">Doğrulama</p><h2>Model gerçekten daha iyi mi?</h2>
<div class="body"><div class="row grow">
  <div class="card" style="flex:1"><h3>Frozen backtest · WMAPE (düşük iyi)</h3><div class="chart" data-c="bt"></div></div>
  <div class="col" style="flex:1">
    <div class="card"><h3>Üç sızıntı koruması</h3><ul class="tick">
      <li>Çarpan hesabında yalnız <b>tarih &lt; hedef</b> verisi kullanılır</li>
      <li>Taban hesabından <b>olay günlerinin kendisi</b> dışlanır</li>
      <li><span class="mono">forecast_horizon</span>, ufuk içi satır içeren bir talep tablosu alırsa <b>hata fırlatır</b></li>
    </ul></div>
    <div class="card tight"><h3>Frozen ne demek</h3><p class="sub">Eğitim penceresi hedeften önce kesilir ve ufuk içinde <b>yeniden eğitim yapılmaz</b> — gerçek yarışma koşulunun aynısı. Rolling backtest değil, tek atış.</p></div>
  </div>
</div></div>`,
`Modelin işe yaradığını iddia etmek yetmez, ölçmek gerekir.
Normal bir haftada — 15-21 Haziran — bizim model ile DOW medyanı birebir aynı: 0,2174. Bu tesadüf değil, o pencerede takvim etkisi olan bir gün yok, yani katman hiç devreye girmiyor. Zarar vermiyor.
Ay sonu haftasında ise — 30 Mart, 5 Nisan — DOW medyanı 0,5328'den bizim model 0,4464'e iniyor. Naive yaklaşım 0,6972. Yani katman sadece gerektiğinde, ama ciddi biçimde kazandırıyor.
Bu bir frozen backtest: eğitim penceresi hedeften önce kesiliyor ve ufuk içinde yeniden eğitim yok. Gerçek yarışma koşulunun aynısı.
Sağda üç sızıntı koruması var. Üçüncüsü özellikle önemli: fonksiyon, ufuk içi veri görürse çalışmayı reddediyor. Yani gerçekleşen değerin modele sızması kazayla bile mümkün değil, yapısal olarak engellenmiş.`,
`<b>Kullan:</b> Normal hafta ile ay sonu haftasını yan yana okuyun. <b>Vurgula:</b> "aynı sayı olması bir kusur değil, kanıt". <b>Ezberlenecek:</b> 0,5328 → 0,4464. <b>Dürüstlük notu:</b> sorulursa ay sonu haftasındaki bias +%28,3 açık kalemimiz.`);

`<b>Kullan:</b> Ana grafik. Barları soldan sağa gösterin, altındaki yüzde düşüşleri okuyun. <b>Vurgula:</b> SLA'nın bilerek arttığı — bu soruyu jüri kesin soracak, önce siz söyleyin. <b>Ezberlenecek:</b> 16,48 → 14,68 → 11,31 → 11,23 M₺.`);

const CH={ladder:chartLadder,history:chartHistory,cal:chartCal,fc:chartFc,bt:chartBt,
          fleet:chartFleet,chains:()=>chartChains('Stage 2'),fill:chartFill,mix:chartMix,
          milkf:chartMilkFunnel,pickf:chartPickFunnel,clean:chartClean,flow:chartFlow,
          rules:chartRules,pickstop:chartPickStop,runtime:chartRuntime};

const stage=document.getElementById('stage');
SL.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'; el.dataset.i=i; el.innerHTML=s.html;
  stage.appendChild(el);
});
document.querySelectorAll('.chart[data-c]').forEach(node=>{
  const fn=CH[node.dataset.c];
  if(fn) node.innerHTML=fn();
});
document.getElementById('tot').textContent=SL.length;
document.getElementById('tocl').innerHTML=SL.map((s,i)=>`<li data-i="${i}"><b>${i+1}.</b> ${esc(s.title)}</li>`).join('');
document.querySelectorAll('#tocl li').forEach(li=>li.onclick=()=>{go(+li.dataset.i);document.getElementById('toc').classList.remove('on')});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];
function go(i){
  cur=Math.max(0,Math.min(SL.length-1,i));
  slides.forEach((el,j)=>el.classList.toggle('active',j===cur));
  document.getElementById('cur').textContent=cur+1;
  document.getElementById('bar').style.width=((cur+1)/SL.length*100)+'%';
  document.getElementById('ntxt').textContent=SL[cur].notes;
  document.getElementById('nuse').innerHTML=SL[cur].use;
  location.hash=String(cur+1);
}
function fit(){
  const s=Math.min(window.innerWidth/1320,window.innerHeight/760);
  slides.forEach(el=>el.style.transform=`scale(${s})`);
}
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SL.length-1);
  else if(e.key==='n'||e.key==='N')document.getElementById('notes').classList.toggle('on');
  else if(e.key==='o'||e.key==='O')document.getElementById('toc').classList.toggle('on');
  else if(e.key==='Escape'){document.getElementById('toc').classList.remove('on');document.getElementById('notes').classList.remove('on')}
});
addEventListener('click',e=>{
  if(e.target.closest('#toc')||e.target.closest('#notes'))return;
  go(cur + (e.clientX < innerWidth*0.28 ? -1 : 1));
});
fit();
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
