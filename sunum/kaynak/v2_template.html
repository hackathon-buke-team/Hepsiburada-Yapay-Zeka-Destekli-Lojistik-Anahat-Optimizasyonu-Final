          {n:'Nihai plan',q:M(S3.total_cost)+'₺',
           segs:[{v:S3.vehicle_cost,col:'rgba(87,166,255,.75)'},{v:S3.sla_penalty,col:SLA_2}]}])+
  leg([['rgba(87,166,255,.85)','araç maliyeti'],[SLA_2,'SLA cezası']])+
  note('Şartnamede <b>gizli bir SLA tavanı yok</b>: "en fazla şu kadar gecikebilir" diye bir kural yazılmamış. Gecikme yasak bir davranış değil, fiyatı belli bir seçenektir.')+
  note('Biz de bunu bilinçli kullanıyoruz. Nihai planda SLA cezasını '+M(S3.sla_penalty-S0.sla_penalty)+
       '₺ <b>artırdık</b>, çünkü aynı hamle araç maliyetinden '+M(S0.vehicle_cost-S3.vehicle_cost)+
       '₺ kazandırdı. Bu bir ihlal değil, kuralların içinde kalan bir <b>maliyet takası</b> — ve hakem simülatörü her aşamada sıfır ihlal veriyor.','hl'))}
,

/* ══════════════ Stage 2 · milk-run detayları ══════════════ */
's2-arama':{k:'Stage 2 · arama',t:'101.795 kombinasyon denendi, 227 zincir kabul edildi',b:()=>
  pdef('<b>Zincir nedir?</b> Aynı merkezden <em>aynı dakikada</em> kalkan k adet ayrı araç, tek bir fiziksel araca bindirilir. Araç sırayla her varış merkezine uğrar, yükün oraya ait kısmını bırakır, kalanla devam eder. <em>Kaç segment taşındığı değişmez — kaç araç kiralandığı değişir.</em>')+
  pcols(
  ps(nf(D.milkrun.groups_considered),'Aday grup — aynı merkez, aynı dakika','sm')+
  ps(nf(D.milkrun.pairs_evaluated+D.milkrun.triples_evaluated),'Fiyatlandırılan kombinasyon','sm blue')+
  ps(nf(D.milkrun.chains_accepted),'Kabul edilen zincir','sm ok')+
  ps('%'+nf(100*D.milkrun.chains_accepted/(D.milkrun.pairs_evaluated+D.milkrun.triples_evaluated),3),'Kabul oranı — arama gerçekten eliyor','sm brand')+
  ps(D.meta.max_chain_stops+' durak','Kendi koyduğumuz üst sınır — kuralın değil','sm warn'),
  '<div class="pmap mid">'+chartMilkFunnel()+'</div>'+
  note('<b>Huni neden önce genişliyor?</b> Çünkü bunlar üç ayrı şey. <b>'+nf(D.milkrun.groups_considered)+' aday grup</b>, aynı merkez-dakikada buluşan araç <i>kümeleridir</i>. Bu kümelerin içinden çıkarılabilecek <b>'+nf(D.milkrun.pairs_evaluated)+' çift</b> ve <b>'+nf(D.milkrun.triples_evaluated)+' çoklu alt küme</b> tek tek fiyatlandırılır — üstelik her alt kümenin <i>uğrama sırası</i> da ayrı bir adaydır. Sonunda kabul edilen '+nf(D.milkrun.chains_accepted)+' zincir kalır.')+
  note('<b>Bir aday nasıl kabul edilir?</b> İki koşul birden gerekir. Birincisi: zincirin toplam maliyeti, yerine geçtiği k aracın toplamından <b>düşük</b> olmalı. İkincisi: ortaya çıkan plan hakem simülatöründen <b>0 ihlalle</b> geçmeli. İkinci koşul sağlanmazsa aday, kârlı olsa bile atılır ve resmî çıktı hiç değişmez.')+
  note('<b>Kimlik kontrolü:</b> Stage 1 planında '+nf(S('Stage 1').routes)+' araç vardı. Kabul edilen zincirler '+nf(D.milkrun.source_vehicles_replaced)+' aracın yerine geçti ve onların yerine '+nf(D.milkrun.chains_accepted)+' araç kondu: '+nf(S('Stage 1').routes)+' − '+nf(D.milkrun.source_vehicles_replaced)+' + '+nf(D.milkrun.chains_accepted)+' = <b>'+nf(S('Stage 2').routes)+'</b>. Segment sayısı ise '+nf(S('Stage 1').segments)+'’de <b>sabit</b> kaldı — zincir yeni bacak yaratmaz, var olanları tek araca bindirir.','hl')+
  note('<b>Neden en fazla '+D.meta.max_chain_stops+' durak?</b> Şartnamede üst sınır yok; sınır bizim. 5 duraklı zinciri kaba kuvvetle denedik: C(n,5) alt küme × 120 sıralama, 13,5 dakika CPU ve 1,3 GB bellekten sonra sonuç alınamadı. Budamalı bir arama olmadan 5 durak kapalı bir kapı — bunu açık kalem olarak yazıyoruz.'))},

's2-zincir':{k:'Stage 2 · sonuç',t:'227 zincir hangi uzunlukta ve ne kazandırdı',b:()=>
  pdef('<b>Grafiği nasıl okumalı?</b> Halka, nihai plandaki <em>fiziksel araç</em> sayısını uzunluğa göre böler. “1 bacak” tek durağa giden sıradan bir seferdir; “4 durak” ise dört ayrı aracın işini üstlenen bir zincirdir.')+
  pcols(
  ps(nf(D.milkrun.chain_size_mix['2'])+' / '+nf(D.milkrun.chain_size_mix['3'])+' / '+nf(D.milkrun.chain_size_mix['4']),'2 / 3 / 4 duraklı zincir sayısı','sm')+
  ps(nf(D.milkrun.source_vehicles_replaced)+' → '+nf(D.milkrun.chains_accepted),'Yerine geçilen araç → zincir','sm ok')+
  ps(M(D.milkrun.desi_consolidated)+' desi','Konsolide edilen yük','sm blue')+
  ps(nf(D.milkrun.parts_consolidated),'Birleştirilen talep parçası','sm')+
  ps(M(D.milkrun.local_saving_tl)+'₺','Yalnız bu adımın kazancı','sm brand'),
  chainSVG()+
  note('Yukarıdaki harita <b>uydurma değil</b>: nihai planımızdaki '+NET.chain.vehicle+' numaralı '+NET.chain.type.toLowerCase()+'. 30 Haziran 17:36’da Mersin’den '+nf(NET.chain.stops[0].load)+' desi ve '+NET.chain.stops[0].parts+' talep parçasıyla çıkıyor; Şanlıurfa, Mardin, Erzincan ve Sivas’a sırayla uğrayıp yükünü bırakıyor; 1 Temmuz 10:52’de boşalıyor. Milk-run olmasaydı bu <b>dört ayrı araç</b> demekti.')+
  pbars([{n:'2 duraklı',v:D.milkrun.chain_size_mix['2'],q:D.milkrun.chain_size_mix['2']+' zincir'},
         {n:'3 duraklı',v:D.milkrun.chain_size_mix['3'],q:D.milkrun.chain_size_mix['3']+' zincir'},
         {n:'4 duraklı',v:D.milkrun.chain_size_mix['4'],q:D.milkrun.chain_size_mix['4']+' zincir',c:'hi'}],1)+
  note('<b>Neden 4 duraklı zincirler 3 duraklılardan çok?</b> Çünkü arama uzunluğa değil <b>kârlılığa</b> göre seçiyor. Dört aracı tek araca bindirmek üç katına yakın kazandırır; üç duraklı zincirler ancak dördüncü bir uygun araç bulunamadığında ortaya çıkar. '+nf(D.milkrun.chain_size_mix['4'])+' adet 4 duraklı zincir tek başına '+nf(4*D.milkrun.chain_size_mix['4'])+' aracın işini görüyor.')+
  note('<b>Zincirler hangi araç türünde?</b> '+Object.keys(D.milkrun.chain_type_mix).map(function(t){return D.milkrun.chain_type_mix[t]+' '+t.toLowerCase()}).join(' · ')+'. Tır listede <b>yok</b> ve bu bilinçli: tırı zincire katmayı ölçtük, 18.100 ₺ <b>daha kötü</b> sonuç verdi. Kamyon aynı 12.000 desi kapasitede tırdan ucuz (318,25 ₺/sa karşı 487,50 ₺/sa) ve kârlı tır adaylarının %93,6’sı tır kotası sıfır olan yedi merkez yüzünden ölüyor.','hl'))},

/* ══════════════ Stage 3 · yük alma detayı ══════════════ */
's3-pickup':{k:'Stage 3 · yük alma',t:'Rota ortasında yük alma — ve rotanın neden uzamadığı',b:()=>
  pdef('<b>Tier A nedir?</b> Bir zincir ara durakta yalnız <em>indirmez</em>, oradan kalkacak yükü de <em>alır</em>. Kritik kısıt bizim koyduğumuz: alınan yükün varış merkezi, rotanın <em>zaten uğrayacağı</em> bir durak olmak zorunda. Böylece rota bir metre bile uzamaz, topoloji hiç değişmez.')+
  pcols(
  ps(nf(D.pickup.routes_considered),'Hedef rota — Stage 2’nin zincirleri','sm')+
  ps(nf(D.pickup.donors_available),'Donör araç — yükünü devredebilecek','sm blue')+
  ps(nf(D.pickup.pairs_examined),'Fiyatlandırılan (rota, donör) çifti','sm')+
  ps(nf(D.pickup.profitable_candidates)+' → '+nf(D.pickup.pickups_accepted),'Kârlı aday → çakışmasız kabul','sm ok')+
  ps(nf(D.pickup.desi_picked_up)+' desi','Yol üstünden alınan yük · '+nf(D.pickup.parts_picked_up)+' parça','sm brand'),
  '<div class="pmap wide">'+chartPickStop()+'</div>'+
  note('<b>Kural dayanağı jürinin kendi cümlesi:</b> “bir araçtan x kadar yük indirilip y kadar yük yüklenirse kapasiteden x artı y kadar yük düşülür.” Bu tek cümle hem işlemin serbest olduğunu söylüyor hem de elleçleme aritmetiğini veriyor.')+
  '<pre style="margin-top:15px">unload_end   = varış + elleçleme(inen)          <b>← SLA saati burada durur</b>\ndepart_after = unload_end + elleçleme(alınan)   <b>← araç ancak bundan sonra kalkar</b></pre>'+
  note('<b>Buradaki sessiz hata:</b> bir yük alma durağında <b>iki ayrı zaman damgası</b> vardır. İnen kargo, indirilmesi bittiği anda teslim edilmiştir; sonradan yapılan yükleme aracı geciktirir ama <b>o teslimatı geciktirmez</b>. İkisini tek damgaya indirgemek, olmayan bir SLA cezası uydurur. Prototipimizde tam olarak bu hata yapıldı ve <b class="brand">hakem simülatörü yakaladı</b> — başka hiçbir kontrol fark etmemişti.','hl')+
  note('<b>Neden '+nf(D.pickup.profitable_candidates)+' kârlı adaydan yalnız '+nf(D.pickup.pickups_accepted)+'’i kabul edildi?</b> Çünkü aynı donör aracı birden fazla rota istiyor. Çakışma çözümünde her donör yalnız bir kez kullanılabilir, kalanlar elenir. Kabul edilen '+nf(D.pickup.pickups_accepted)+' hamle '+nf(D.pickup.donor_vehicles_removed)+' aracı plandan tamamen sildi ve '+nf(D.pickup.local_saving_tl,2)+' ₺ kazandırdı.')+
  note('<b>Tier B neden yok?</b> Tier B, alınan yükün varışı rotada olmasa bile rotayı <b>bir durak uzatarak</b> yükü taşımayı önerir. Bağımsız ölçümümüz ek ~66 bin ₺ gösterdi; ancak rota topolojisini değiştirdiği için hakem kurallarının çok daha geniş bir kısmını etkiliyor. Kalan sürede güvenle doğrulayamadığımız için <b>bilinçli olarak dışarıda bıraktık</b> — açık kalem olarak duruyor.'))},

/* ══════════════ Filo etkisi — grafik detayları ══════════════ */
'f-fleet':{k:'Etki · filo',t:'Fiziksel araç sayısı neden bu kadar önemli',b:()=>
  pdef('<b>“Fiziksel araç” ne demek?</b> Faturaya giren birim. Bir araç kaç merkeze uğrarsa uğrasın <em>tek bir kullanım penceresi</em> için ücretlendirilir. Dolayısıyla araç sayısını düşürmek, aynı yükü aynı mesafede taşırken maliyeti düşürmenin en doğrudan yoludur.')+
  pcols(
  STG.map(function(k,i){return ps(nf(S(k).routes),k+' — '+['temel plan','aynı-hat onarım','milk-run','yük alma'][i],'sm'+(i===3?' brand':''))}).join('')+
  ps('−%47,6',nf(S('Stage 0').routes)+' → '+nf(S('Stage 3').routes)+' fiziksel araç','sm ok'),
  '<div class="pmap mid">'+chartFleet()+'</div>'+
  note('<b>Segment sayısı ile araç sayısı aynı şey değildir.</b> Segment, “A’dan B’ye bir hareket” demektir ve taşınacak yük onu zorunlu kılar. Araç ise o hareketleri koşan, saatlik ücretlendirilen birimdir. Stage 2’de segment sayısı '+nf(S('Stage 1').segments)+'’de sabit kalırken araç '+nf(S('Stage 1').routes)+'’den '+nf(S('Stage 2').routes)+'’e indi: <b>aynı işi daha az araçla</b> yaptık.')+
  '<table class="anim"><thead><tr><th>Aşama</th><th class="n">Segment</th><th class="n">Fiziksel araç</th><th class="n">Kiralık</th><th class="n">Spot</th><th class="n">Araç maliyeti</th></tr></thead><tbody>'+
  STG.map(function(k,i){var x=S(k);return '<tr'+(i===3?' class="hi"':'')+'><td>'+k+'</td><td class="n">'+nf(x.segments)+'</td><td class="n">'+nf(x.routes)+'</td><td class="n">'+nf(x.rented_routes)+'</td><td class="n">'+nf(x.spot_routes)+'</td><td class="n">'+M(x.vehicle_cost)+'₺</td></tr>'}).join('')+
  '</tbody></table>'+
  note('<b>Kiralık sayısı hiç değişmiyor</b> ve bu doğru: 12 zorunlu rota × 9 çıkış tarihi = '+nf(S('Stage 0').rented_routes)+' araç her aşamada aynen duruyor, çünkü onları iptal etme yetkimiz yok. Optimizasyonun dokunabildiği tek yer spot filodur: '+nf(S('Stage 0').spot_routes)+' → '+nf(S('Stage 3').spot_routes)+'.','hl'))},

'f-fill':{k:'Etki · doluluk',t:'Kümülatif doluluk eğrisi nasıl okunur',b:()=>
  pdef('<b>Kümülatif dağılım nedir?</b> Yatay eksende bir doluluk oranı seçin; eğri size “araçların yüzde kaçı bu orandan <em>daha az</em> dolu” cevabını verir. Eğri ne kadar <em>sağa</em> yaslanmışsa o kadar çok araç yüksek dolulukta demektir.')+
  pcols(
  STG.map(function(k,i){return ps('%'+nf(S(k).avg_fill,2),k+' ortalama doluluk','sm'+(i===3?' ok':''))}).join('')+
  ps(nf(S('Stage 0').spot_below_30)+' → '+nf(S('Stage 3').spot_below_30),'%30’un altında dolu spot araç','sm brand'),
  '<div class="pmap mid">'+chartFill()+'</div>'+
  note('<b>Somut okuma:</b> Stage 0 eğrisi %30 çizgisini yüksekten keser — '+nf(S('Stage 0').spot_routes)+' spot aracın <b>'+nf(S('Stage 0').spot_below_30)+' tanesi</b> üçte birinden az doluydu. Nihai planda bu sayı <b>'+nf(S('Stage 3').spot_below_30)+'</b>. Yarı boş bir araç, ödenmiş ama kullanılmamış kapasitedir.')+
  note('<b>Neden %100 değil?</b> Çünkü doluluk kendi başına bir hedef değil, maliyetin bir <b>göstergesi</b>. Bir aracı sonuna kadar doldurmak için başka bir yükü saatlerce bekletmek, kazandırdığından fazla SLA cezası ödetebilir. Optimizasyon doluluğu değil <b>toplam maliyeti</b> minimize eder; %'+nf(S('Stage 3').avg_fill,2)+' bunun sonucudur, amacı değil.','hl')+
  note('Eğrinin sağ ucundaki dik yükseliş tam dolu araçların yoğunluğunu gösterir. Kiralık filo da bu grafikte yer alır ve doluluğu bizim kontrolümüzde değildir — zorunlu rotalar talep olmasa da çıkar.'))},

'f-mix':{k:'Etki · araç karması',t:'Neden kamyonet azaldı, kamyon arttı, tır hiç değişmedi',b:()=>
  pdef('<b>Karma neden değişiyor?</b> Konsolidasyon yarı dolu küçük araçları birleştirir. İki yarı dolu kamyonetin yükü tek bir kamyona sığdığında kamyonet sayısı iki azalır, kamyon sayısı bir artar. Araç <em>sayısı</em> düşerken ortalama araç <em>boyu</em> büyür.')+
  pcols(
  ps(nf(S('Stage 0').vehicle_mix['Kamyonet'])+' → '+nf(S('Stage 3').vehicle_mix['Kamyonet']),'Kamyonet','sm brand')+
  ps(nf(S('Stage 0').vehicle_mix['Kamyon'])+' → '+nf(S('Stage 3').vehicle_mix['Kamyon']),'Kamyon','sm blue')+
  ps(nf(S('Stage 0').vehicle_mix['Hafif Kamyon'])+' → '+nf(S('Stage 3').vehicle_mix['Hafif Kamyon']),'Hafif Kamyon','sm')+
  ps(nf(S('Stage 0').vehicle_mix['Tır'])+' → '+nf(S('Stage 3').vehicle_mix['Tır']),'Tır — hiç değişmedi','sm ok'),
  '<div class="pmap mid">'+chartMix()+'</div>'+
  '<table class="anim"><thead><tr><th>Araç türü</th><th class="n">Kapasite (desi)</th><th class="n">Spot ₺/sa</th><th class="n">Spot ₺/km</th><th class="n">Stage 0</th><th class="n">Nihai</th></tr></thead><tbody>'+
  ['Kamyonet','Hafif Kamyon','Kamyon','Tır'].map(function(t){
    var v=NET.vehicles.filter(function(x){return x[0]===t})[0];
    return '<tr'+(t==='Tır'?' class="hi"':'')+'><td>'+t+'</td><td class="n">'+nf(v[1])+'</td><td class="n">'+nf(v[4],2)+'</td><td class="n">'+nf(v[5],0)+'</td><td class="n">'+nf(S('Stage 0').vehicle_mix[t]||0)+'</td><td class="n">'+nf(S('Stage 3').vehicle_mix[t]||0)+'</td></tr>'}).join('')+
  '</tbody></table>'+
  note('<b>Tırın 99’da sabit kalması bir tercih, bir sınır değil.</b> Tır 22.400 desi taşır ama saatlik 487,50 ₺’ye mal olur; kamyon 12.000 desiyi 318,25 ₺/sa ile taşır. Desi başına maliyette tır ancak <b>tam dolu</b> giderse öne geçer — ve yedi merkezde tır kotası sıfır olduğu için tam dolu bir tır rotası bulmak çoğu zaman imkânsız. Kıt kaynağı zorlamak yerine zorunlu kiralıklara bıraktık.','hl')+
  note('Zaten planımızdaki tırların neredeyse tamamı zorunlu kiralık filodan geliyor: günde 10 kiralık tır × 9 çıkış tarihi = 90, üstüne 9 spot tır. Yani tır sayısını biz değil, şartname seçiyor.'))},

/* ══════════════ Hakem simülatörü ══════════════ */
'q-hakem':{k:'Kalite kapıları',t:'Hakem simülatörü — nedir, neden yazdık, ne yakaladı',b:()=>
  pdef('<b>Hakem simülatörü nedir?</b> Planlayıcıdan <em>tamamen ayrı</em> yazılmış ikinci bir uygulama. Optimizatörün iç durumunu hiç görmez; yalnızca diske yazılan Excel çıktısını ve şartnamenin ham veri dosyalarını okur, maliyeti ve 17 kuralı <em>sıfırdan yeniden hesaplar</em>. Kısacası jürinin bizi değerlendireceği hesabı, teslimden önce kendimize uygularız.')+
  pcols(
  ps('17','Yeniden hesaplanan kural','sm')+
  ps('592 / 592','Geçen regresyon testi','sm ok')+
  ps('0','Nihai plandaki ihlal','sm ok')+
  ps('0,0000 ₺','Beyan ettiğimiz maliyet ile hakemin hesabı arasındaki fark','sm brand')+
  ps('3 / 3','Stage 3 prototipindeki hatadan kaçını yakaladı','sm warn'),
  note('<b>Neden buna ihtiyaç var?</b> Bir optimizasyon kodu kendi hesabına göre daima haklıdır. Maliyeti hesaplayan fonksiyonla planı üreten fonksiyon aynı varsayımı paylaşıyorsa, ikisi de yanlış olduğunda <b>hiçbir test bunu göremez</b>. Bağımsız bir ikinci uygulama tam bu kör noktayı kapatır: iki uygulama aynı sayıyı üretmiyorsa ortada gerçek bir hata vardır.')+
  note('<b>Bağımsızlık nasıl sağlandı?</b> Hakem, optimizatörün hiçbir veri yapısını, ara değişkenini ya da yardımcı fonksiyonunu paylaşmaz. Girdisi yalnızca iki şeydir: diske yazılmış <b>Taşıma Planı Excel’i</b> ve şartnamenin <b>ham veri dosyaları</b>. Zaman aritmetiğini, gece yarısı bölmesini, SLA cezasını ve kapasite kontrollerini kendi kodundan yeniden türetir.')+
  '<table class="anim"><thead><tr><th>Kapı</th><th>Ne kontrol eder</th><th>İhlal olursa</th></tr></thead><tbody>'+
  [['17 kural','Plan fiziksel ve kurallı olarak mümkün mü','Tek ihlal → aday reddedilir, resmî çıktı değişmez'],
   ['Uzlaşma kapısı','Aramanın hesapladığı tasarruf ile hakemin ölçtüğü fark','Kuruşun milyonda birinden fazla sapma → yayın durur'],
   ['Aşama kapıları','Stage 2 için 20, Stage 3 için 23 birebir sabit sayı','Sessiz kazanç kaybı fark edilmeden geçemez'],
   ['Determinizm','Girdi satırları karıştırılınca plan değişiyor mu','Bir hücre bile farklıysa hata'],
   ['Artifact doğrulama','Yazılan Excel geri okunur, şema doğrulanır, hakem yeniden koşar','Şema ya da maliyet uymazsa dosya yerine konmaz']]
   .map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td style="color:var(--dim);font-size:12px">'+r[2]+'</td></tr>'}).join('')+
  '</tbody></table>'+
  note('<b>Peki gerçekten ne yakaladı?</b> Stage 3 prototipinde üç ayrı hata vardı ve <b>üçünü de yalnız bu kapı</b> gördü. Birincisi: zorunlu kiralık bir rotayı yük alma hedefi seçmek — kiralık araç rota dışına çıkamaz. İkincisi: yanlış SLA zaman damgası — inen kargonun teslim anı yerine aracın kalkış anını kullanmak. Üçüncüsü: alınan yükün, varış durağını geçip rotanın devamına taşınması. Hiçbiri programı çökertmiyordu; üçü de <b>sessizce yanlış ama geçerli görünen</b> bir plan üretiyordu.','hl')+
  note('Hakem, optimizatör daha yazılmamışken bile iki optimizatör-sınıfı hatayı yakaladı. Bu yüzden sıralamayı bilerek tersine çevirdik: <b>önce hakem, sonra optimizatör</b>.'))},

/* ══════════════ Tahmin modeli — iki grafiğin detayı ══════════════ */
't-fc':{k:'Tahmin modeli',t:'Katman nerede devreye giriyor — gün gün',b:()=>{
  const f=D.forecast_vs_dow;
  const TR=l=>l.replace(' Jun',' Haz').replace(' Jul',' Tem');
  /* teslim edilen ufuk 29.06 – 05.07: ilk üç gün takvim olayı, kalanı normal */
  const M4=[['Ay sonu −1 gün',D.calendar.day_before_month_end],
            ['Ayın son günü',D.calendar.month_end],
            ['Ayın ilk günü',D.calendar.first_day_after_month_end],
            ['Normal gün',1],['Normal gün',1],['Normal gün',1],['Normal gün',1]];
  const tot=f.dow_mean.reduce((a,b)=>a+b,0);

'k-use':{k:'Kurallar · zaman',t:'Kullanım süresi — tek sürekli pencere',b:()=>{
  const T=NET.trip, t0=17*60;
  const mm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const rows=[
    [mm(t0),'Talep tamamlanır','Yük artık taşınabilir. <b>SLA saati burada başlar.</b>',C.ok],
    [mm(t0),'Çıkış elleçlemesi başlar','<b>Kullanım süresi saati burada başlar</b> — araç henüz hareket etmedi.',C.brand],
    [mm(t0+T.hload),'Araç yola çıkar','ceil('+nf(T.desi)+' × 0,01) = '+T.hload+' dakika elleçleme bitti.',C.blue],
    [mm(t0+T.hload+T.travel),'Varış merkezine ulaşır','Yol '+T.km+' km · '+T.travel+' dakika.',C.purple],
    [mm(t0+T.use),'İndirme biter','<b>Her iki saat de burada durur:</b> teslim gerçekleşti, araç serbest.',C.brand2]];
  return pdef('<b>Kullanım süresi nedir?</b> Bir spot aracın faturalandığı süre: <em>ilk yükleme başlangıcından son indirme bitişine kadar tek, kesintisiz bir pencere</em>. Parçalı değildir — araç yolda mı, merkezde bekliyor mu, elleçleniyor mu fark etmez; pencerenin içindeki her dakika ödenir.')+
  pcols(
  ps(T.use+' dk','Toplam kullanım süresi = '+nf(T.use/60,2)+' saat','sm brand')+
  ps(T.hload+' + '+T.travel+' + '+T.hunload,'Çıkış elleçleme + yolculuk + varış elleçleme','sm')+
  ps(nf(T.rate_h,2)+' ₺/sa','Kamyon spot saatlik kira','sm blue')+
  ps(nf(T.use/60*T.rate_h,2)+' ₺','Yalnız süreden gelen maliyet','sm')+
  ps('%'+nf(100*(T.hload+T.hunload)/T.use,1),'Sürenin elleçlemede geçen payı','sm warn'),
  '<div class="pmap wide">'+chartFlow()+'</div>'+
  '<table class="anim"><thead><tr><th class="n">Saat</th><th>Ne olur</th><th>Sayaçlara etkisi</th></tr></thead><tbody>'+
  rows.map(function(r){return '<tr><td class="n" style="color:'+r[3]+';font-weight:700">'+r[0]+
    '</td><td><b>'+r[1]+'</b></td><td style="color:var(--muted);font-size:12px">'+r[2]+'</td></tr>'}).join('')+
  '</tbody></table>'+
  note('<b>Jüri bunu üç ayrı soruda netleştirdi</b> ve tanım her seferinde aynı çıktı: süre <b>ilk yükleme başlangıcında</b> başlar, <b>son indirme bitişinde</b> durur, ve aradaki <b>bekleme dâhildir</b>. Yani "aracı yolda tutmak" ile "aracı merkezde bekletmek" aynı fiyata mal olur.')+
  note('<b>İki ayrı saat, iki ayrı başlangıç.</b> SLA saati talebin tamamlanma anında (09:00 ya da 17:00) başlar; kullanım süresi ise aracın o yükü <b>fiilen yüklemeye başladığı</b> anda. Yukarıdaki seferde ikisi çakışıyor çünkü araç talebi bekletmeden aldı — ama konsolidasyon için bekleyen bir yükte SLA saati işlerken kullanım süresi henüz başlamamış olur.','hl')+
  note('<b>Optimizasyona etkisi doğrudan:</b> bir aracı doldurmak için beklemek <b>iki kalemden birden</b> ödetir — bekleyen yükün SLA cezası artar, ve zincirdeki aracın kullanım penceresi uzar. Bu yüzden Stage 2’de zincir kabul kuralı "daha az araç" değil, <b>"toplam maliyet düştü mü"</b> sorusudur.')+
  note('<b>Yuvarlama:</b> tüm süreler bir üst tam dakikaya çıkar. Elleçleme desi başına 0,01 dakikadır ve <b>yükleme ile indirme ayrı ayrı</b> hesaplanır — üstelik her talep parçası kendi içinde yuvarlanır, bu yüzden bir bacağın toplam elleçlemesi, toplam desinin yuvarlamasından biraz büyük olabilir.')+
  note('<b>Faturaya girmeyenler:</b> boş dönüş yoktur — araç varışta bırakılır, geri getirme maliyeti yoktur. Sabit çağırma ücreti, günlük taban ücret ya da minimum süre de yoktur. Bir araç ne kadar kullanılırsa o kadar ödenir.'))}},

'k-cost':{k:'Kurallar · maliyet',t:'Maliyet formülü — üç terim, dördüncüsü yok',b:()=>{
  const T=NET.trip, hrs=T.use/60, vc=hrs*T.rate_h, kc=T.km*T.rate_km;
  return pdef('<b>Toplam maliyet</b> yalnız üç terimin toplamıdır: aracın <em>süre</em> maliyeti, aracın <em>mesafe</em> maliyeti, ve varsa <em>SLA gecikme cezası</em>. Şartnamede dördüncü bir kalem yoktur — bu, optimizasyonun neyi hedefleyeceğini tek başına belirler.')+
  pcols(
  ps(nf(T.cost,2)+' ₺','Örnek seferin toplam maliyeti','sm brand')+
  ps(nf(vc,2)+' ₺','Süre terimi · %'+nf(100*vc/T.cost,1),'sm')+
  ps(nf(kc,2)+' ₺','Mesafe terimi · %'+nf(100*kc/T.cost,1),'sm blue')+
  ps('0,40 ₺','Geciken desi × ceil(saat) başına ceza','sm warn')+
  ps('0,0000 ₺','Bizim hesabımız ile hakemin farkı','sm ok'),
  '<div class="pmap wide">'+chartFormula()+'</div>'+
  '<table class="anim"><thead><tr><th>Araç türü</th><th class="n">Kapasite</th><th class="n">Kiralık ₺/sa</th><th class="n">Kiralık ₺/km</th><th class="n">Spot ₺/sa</th><th class="n">Spot ₺/km</th></tr></thead><tbody>'+
  ['Kamyonet','Hafif Kamyon','Kamyon','Tır'].map(function(t){
    const v=NET.vehicles.filter(function(x){return x[0]===t})[0];
    return '<tr'+(t===T.type?' class="hi"':'')+'><td>'+t+'</td><td class="n">'+nf(v[1])+
      '</td><td class="n">'+nf(v[2],2)+'</td><td class="n">'+nf(v[3],0)+
      '</td><td class="n">'+nf(v[4],2)+'</td><td class="n">'+nf(v[5],0)+'</td></tr>'}).join('')+
  '</tbody></table>'+
  note('<b>Kiralık ve spot aynı aracı farklı fiyatlar.</b> Kiralık tarifeler daha ucuzdur ama seçim hakkımız yoktur: 12 zorunlu rota her gün çıkar. Spot tarifeler pahalıdır ama tamamen bizim kontrolümüzdedir — optimizasyonun oynadığı tek yer burasıdır.')+
  note('<b>Kapasite başına maliyet, tür seçimini belirler.</b> Kamyon 12.000 desiyi '+nf(NET.vehicles.filter(function(x){return x[0]==='Kamyon'})[0][4],2)+' ₺/sa ile taşır; tır 22.400 desiyi '+nf(NET.vehicles.filter(function(x){return x[0]==='Tır'})[0][4],2)+' ₺/sa ile. Tır ancak <b>tam dolu</b> giderse desi başına öne geçer — ve yedi merkezde tır kotası sıfır olduğu için tam dolu bir tır rotası çoğu zaman kurulamaz.','hl')+
  note('<b>SLA cezası neden yasak değil?</b> Şartnamede "en fazla şu kadar gecikebilir" diye bir kural yok. Ceza doğrusal ve hesaplanabilir: geciken desi × yukarı yuvarlanmış saat × 0,40 ₺. Dolayısıyla bir aracı yola çıkarmak, küçük bir gecikme cezasından pahalıysa <b>cezayı satın almak doğru karardır</b>. Nihai planımızda SLA cezası bilerek arttı, araç maliyeti daha fazla düştü.')+
  note('<b>Kuruşu kuruşuna doğrulama:</b> yukarıdaki '+nf(T.cost,2)+' ₺ elle hesaplanmadı — teslim ettiğimiz Excel’in <span class="mono">Toplam maliyet</span> hücresiyle birebir aynı, ve hakem simülatörü aynı sayıyı ham veriden bağımsız olarak yeniden üretiyor.'))}}
};

`Ağ 18 transfer merkezi ve 306 yönlü hattan oluşuyor. Geçmiş veride bunların 289'unda gerçekten talep görülmüş.
Sol tarafta bizi sıkıştıran kısıtlar var. En sert olanı iki tanesi: elleçleme kapasitesi — her merkezin günlük bir işlem limiti var ve gece yarısını aşan bir elleçleme oransal olarak iki güne bölünüyor. İkincisi tır kapasitesi — yedi merkezde sıfır, yani oralara tır hiç giremiyor, ve zorunlu kiralık tırlar bu kotayı zaten tüketiyor.
Sağ taraf ise fırsat tarafı. Jüri soru-cevabında net olarak şunu söyledi: spot araçlarla sınırsız sefer ve uğrama yapabilirsiniz, durak sayısında bir üst sınır yok. Çözümümüzün en büyük kazancı tam olarak buradan geliyor.
Ve kritik bir nokta: gizli bir SLA tavanı yok. Yani ceza ödemek yasak değil, sadece pahalı. Bu bir maliyet takası ve biz bunu bilinçli kullanıyoruz.`,

`Elimizdeki geçmiş veri 66 bin satır, 1 Ocak – 28 Haziran arası 179 gün.

add('Tahmin modeli',`
<p class="kicker">Talep tahmini</p><h2>İki katman: haftagünü tabanı × takvim çarpanı <span class="pophint">iki grafik de tıklanabilir</span></h2>

  </div>
</div>`,
`Model iki katmanlı ve kasten sade.
Taban katman: her çıkış-varış-saat-haftagünü kombinasyonu için, hedef tarihten kesin önceki son dört gözlemin medyanı. Medyan, çünkü ortalama tek bir sıçramadan bozuluyor.
İkinci katman takvim çarpanı. Solda gördüğünüz üç sayı uydurma değil, geçmiş ay sonlarından ölçüldü: ay sonundan bir önceki gün 0,68; ayın son günü 0,0198; ayın ilk günü 1,21. Her çarpan beş ay sonundan alınan beş oranın medyanı — o günün gerçekleşeni bölü aynı hücrelerin DOW taban toplamı. Tabana bölmek ay sonu etkisini haftagünü etkisinden ayırıyor.
Sağdaki grafik katmanın nerede devreye girdiğini gösteriyor. 30 Haziran'da tahminimiz 24 bin desi, sıradan bir salı ortalaması 1 milyon 110 bin. Kalan dört gün ise düz ortalamaya çok yakın — yani model sadece gerekli yerde müdahale ediyor.`,
`<b>Kullan:</b> Önce formül satırı, sonra soldaki çarpanlar, sonra sağdaki karşılaştırma. <b>Vurgula:</b> "çarpanlar ölçüldü, seçilmedi". <b>Ezberlenecek:</b> ×0,0198 · 24.040 desi vs 1.110.177.`);

add('Backtest',`
<p class="kicker">Doğrulama</p><h2>Model gerçekten daha iyi mi?</h2>
<div class="body"><div class="row grow">
  <div class="card" style="flex:1"><h3>Frozen backtest · WMAPE (düşük iyi)</h3><div class="chart" data-c="bt"></div></div>
  <div class="col" style="flex:1">
    <div class="card"><h3>Üç sızıntı koruması</h3><ul class="tick">
      <li>Çarpan hesabında yalnız <b>tarih &lt; hedef</b> verisi kullanılır</li>
      <li>Taban hesabından <b>olay günlerinin kendisi</b> dışlanır</li>
      <li><span class="mono">forecast_horizon</span>, ufuk içi satır içeren bir talep tablosu alırsa <b>hata fırlatır</b></li>
    </ul></div>
    <div class="card tight"><h3>Frozen ne demek</h3><p class="sub">Eğitim penceresi hedeften önce kesilir ve ufuk içinde <b>yeniden eğitim yapılmaz</b> — gerçek yarışma koşulunun aynısı. Rolling backtest değil, tek atış.</p></div>
  </div>
</div></div>`,
`Modelin işe yaradığını iddia etmek yetmez, ölçmek gerekir.
Normal bir haftada — 15-21 Haziran — bizim model ile DOW medyanı birebir aynı: 0,2174. Bu tesadüf değil, o pencerede takvim etkisi olan bir gün yok, yani katman hiç devreye girmiyor. Zarar vermiyor.
Ay sonu haftasında ise — 30 Mart, 5 Nisan — DOW medyanı 0,5328'den bizim model 0,4464'e iniyor. Naive yaklaşım 0,6972. Yani katman sadece gerektiğinde, ama ciddi biçimde kazandırıyor.
Bu bir frozen backtest: eğitim penceresi hedeften önce kesiliyor ve ufuk içinde yeniden eğitim yok. Gerçek yarışma koşulunun aynısı.
Sağda üç sızıntı koruması var. Üçüncüsü özellikle önemli: fonksiyon, ufuk içi veri görürse çalışmayı reddediyor. Yani gerçekleşen değerin modele sızması kazayla bile mümkün değil, yapısal olarak engellenmiş.`,
`<b>Kullan:</b> Normal hafta ile ay sonu haftasını yan yana okuyun. <b>Vurgula:</b> "aynı sayı olması bir kusur değil, kanıt". <b>Ezberlenecek:</b> 0,5328 → 0,4464. <b>Dürüstlük notu:</b> sorulursa ay sonu haftasındaki bias +%28,3 açık kalemimiz.`);

`<b>Kullan:</b> Ana grafik. Barları soldan sağa gösterin, altındaki yüzde düşüşleri okuyun. <b>Vurgula:</b> SLA'nın bilerek arttığı — bu soruyu jüri kesin soracak, önce siz söyleyin. <b>Ezberlenecek:</b> 16,48 → 14,68 → 11,31 → 11,23 M₺.`);

`Stage 0 kısıtları sağlayan ilk geçerli planı kuruyor.

`Stage 2 en büyük kazancı getiren aşama.

/* ══════════════ kurulum ══════════════ */
const CH={ladder:chartLadder,history:chartHistory,cal:chartCal,fc:chartFc,bt:chartBt,
          fleet:chartFleet,chains:()=>chartChains('Stage 2'),fill:chartFill,mix:chartMix,
          milkf:chartMilkFunnel,pickf:chartPickFunnel,clean:chartClean,flow:chartFlow,
          formula:chartFormula,rules:chartRules,pickstop:chartPickStop};

const stage=document.getElementById('stage');
SL.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'; el.dataset.i=i; el.innerHTML=s.html;
  if(s.title!=='Kapak'){                       /* kapakta zaten büyük logo var */
    const lg=document.createElement('img');
    lg.className='cnrlogo'; lg.src=PH.hb; lg.alt='Hepsiburada';
    el.appendChild(lg);
  }
  stage.appendChild(el);
});
document.querySelectorAll('.chart[data-c]').forEach(node=>{
  const fn=CH[node.dataset.c];
  if(fn) node.innerHTML=fn();
});
document.getElementById('tot').textContent=SL.length;
document.getElementById('tocl').innerHTML=SL.map((s,i)=>`<li data-i="${i}"><b>${i+1}.</b> ${esc(s.title)}</li>`).join('');
document.querySelectorAll('#tocl li').forEach(li=>li.onclick=()=>{go(+li.dataset.i);document.getElementById('toc').classList.remove('on')});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];

/* Aktif slaydın grafiklerini yeniden kur: SVG <animate> öğeleri ancak
   yeniden yaratıldıklarında baştan çalışır. Böylece her slayta her
   dönüşte grafikler yeniden canlanır. */
function replay(el){
  el.querySelectorAll('.chart[data-c]').forEach(node=>{
    const fn=CH[node.dataset.c];
    if(fn) node.innerHTML=fn();
  });
}
function go(i){
  cur=Math.max(0,Math.min(SL.length-1,i));
  slides.forEach((el,j)=>el.classList.toggle('active',j===cur));
  replay(slides[cur]);
  document.getElementById('cur').textContent=cur+1;
  document.getElementById('bar').style.width=((cur+1)/SL.length*100)+'%';
  document.getElementById('ntxt').textContent=SL[cur].notes;
  document.getElementById('nuse').innerHTML=SL[cur].use;
  navp.disabled=cur===0; navn.disabled=cur===SL.length-1;
  location.hash=String(cur+1);
}
function fit(){
  const s=Math.min(window.innerWidth/1320,window.innerHeight/760);
  slides.forEach(el=>el.style.transform=`scale(${s})`);
}
addEventListener('resize',fit);

/* --- kenar okları: fare hareket edince belirir, 2 sn sonra kaybolur --- */
const navp=document.getElementById('navp'), navn=document.getElementById('navn');
let navT=0;
function navShow(){
  if(popOpen())return;
  document.body.classList.add('navon');
  clearTimeout(navT); navT=setTimeout(()=>document.body.classList.remove('navon'),2000);
}
addEventListener('mousemove',navShow);
navp.onclick=e=>{e.stopPropagation();go(cur-1);navShow()};
navn.onclick=e=>{e.stopPropagation();go(cur+1);navShow()};

/* --- pop-up aç / kapat --- */
const popEl=document.getElementById('pop');
const popOpen=()=>popEl.classList.contains('on');
function openPop(k){
  const p=POP[k]; if(!p)return false;
  document.getElementById('popk').textContent=p.k;
  document.getElementById('poph').innerHTML=p.t;
  document.getElementById('popb').innerHTML=p.b();
  const w=popEl.querySelector('.win'); w.scrollTop=0;
  popEl.classList.add('on');
  document.body.classList.remove('navon'); clearTimeout(navT);
  return true;
}
function closePop(){popEl.classList.remove('on')}

addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(popOpen()){closePop();return}
    document.getElementById('toc').classList.remove('on');
    document.getElementById('notes').classList.remove('on');return;
  }
  if(popOpen())return;                       /* pop-up açıkken slayt gezinmesi durur */
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SL.length-1);
  else if(e.key==='n'||e.key==='N')document.getElementById('notes').classList.toggle('on');
  else if(e.key==='o'||e.key==='O')document.getElementById('toc').classList.toggle('on');
});
addEventListener('click',e=>{
  if(popOpen()){                             /* dışarı tıklama yalnız kapatır, slaytı ilerletmez */
    if(!e.target.closest('#pop .win')||e.target.closest('#pop .x'))closePop();
    return;
  }
  if(e.target.closest('#toc')||e.target.closest('#notes')||e.target.closest('.nav'))return;
  const t=e.target.closest('[data-pop]');
  if(t&&openPop(t.dataset.pop))return;
  if(e.target.closest('.slide'))return;        /* slayt içi tıklama sayfayı değiştirmez */
  go(cur + (e.clientX < innerWidth*0.5 ? -1 : 1));
});
fit();
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
</body>
</html>
